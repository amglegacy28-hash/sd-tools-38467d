name: refresh board

on:
  schedule:
    - cron: '17 11 * * *'   # 11:17 UTC daily, ~7am ET, before waivers move
    - cron: '17 23 * * *'   # and again in the evening
  workflow_dispatch: {}       # and a manual button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pull sources, rebuild, run assertions
        run: python build/refresh.py
      - name: publish if the gate passed
        run: |
          cp build/live.html 38467d45f69034e9/index.html
          cp build/board.html 38467d45f69034e9/board.html
          git config user.name  "lions-den-refresh"
          git config user.email "refresh@users.noreply.github.com"
          if git diff --quiet -- 38467d45f69034e9; then
            echo "no change in the rendered page"
          else
            git add 38467d45f69034e9
            git commit -m "auto refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
