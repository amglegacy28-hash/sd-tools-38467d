<meta charset="utf-8">
<title>Lions Den Draft Room</title>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f4f5f7; --panel:#fff; --panel-2:#eceef1; --line:#d5d9df;
  --ink:#171a1f; --ink-2:#5b636e; --ink-3:#878f9a;
  --gold:#a8761b; --gold-soft:#f0e2c6;
  --good:#1c6b45; --good-bg:#dbeee3; --bad:#9c2f2f; --bad-bg:#f5dcdc;
  --warn:#8a5a12; --warn-bg:#f8ecd6; --live:#1c6b45;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14161a; --panel:#1c1f25; --panel-2:#23272e; --line:#31363f;
  --ink:#eef0f3; --ink-2:#a3abb6; --ink-3:#767e8a;
  --gold:#e0a94a; --gold-soft:#3a2f1a;
  --good:#5fd196; --good-bg:#17301f; --bad:#f08a8a; --bad-bg:#341a1a;
  --warn:#e8b866; --warn-bg:#332813; --live:#5fd196;
}}
:root[data-theme="dark"]{
  --ground:#14161a; --panel:#1c1f25; --panel-2:#23272e; --line:#31363f;
  --ink:#eef0f3; --ink-2:#a3abb6; --ink-3:#767e8a;
  --gold:#e0a94a; --gold-soft:#3a2f1a;
  --good:#5fd196; --good-bg:#17301f; --bad:#f08a8a; --bad-bg:#341a1a;
  --warn:#e8b866; --warn-bg:#332813; --live:#5fd196;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;
  line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:64px}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
/* ---- sticky status strip ---- */
.bar{position:sticky;top:0;z-index:30;background:var(--ground);border-bottom:2px solid var(--gold);
  padding:8px 0 7px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--live);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
.bar .st{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bar .rk{margin-left:auto;font-family:Oswald,"Arial Narrow",sans-serif;font-size:16px;font-weight:600;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .rk b{color:var(--gold)}
/* ---- bottom tab bar: one screen at a time ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0)}
/* Eight tabs at 375px leaves ~47px each, which is on the edge of clipping the
   six-letter labels. Below 430px the bar scrolls instead of squeezing - a
   clipped tab label on the phone he actually uses is worse than a swipe. */
@media (max-width:430px){
  nav{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;min-width:64px}
}
nav button{flex:1;background:none;border:none;color:var(--ink-3);cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.06em;
  padding:11px 2px 12px;min-height:52px}
nav button[aria-pressed="true"]{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
/* ---- the decision ---- */
.hero{background:var(--panel);border:2px solid var(--gold);border-radius:8px;padding:15px 16px;margin:12px 0}
.hero.wait{border-color:var(--line);border-width:1px}
.hero .kicker{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold);font-weight:600}
.hero.wait .kicker{color:var(--ink-3)}
.hero .nm{font-family:Oswald,"Arial Narrow",sans-serif;font-size:34px;font-weight:600;
  line-height:1.05;margin:3px 0 1px;text-wrap:balance}
.hero .meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.why{list-style:none;padding:0;margin:12px 0 0}
.why li{display:flex;gap:8px;padding:5px 0;font-size:15px;line-height:1.35}
.why li::before{content:"";flex:none;width:3px;border-radius:2px;background:var(--gold);align-self:stretch}
.why b{font-weight:600}
.alts{margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
.split{margin-top:12px;padding:10px 12px;background:var(--panel-2);border-radius:5px;border:1px solid var(--line)}
.split .lb{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.srow{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:14px;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:none}
.sl{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);min-width:64px}
.sn{flex:1;font-weight:500}
.st2{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.snote{margin-top:7px;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.note{margin-top:12px;padding:10px 12px;background:var(--panel-2);border-left:3px solid var(--ink-3);
  border-radius:4px;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.note .lb{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px}
.alts .lb{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.alt{padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.alt:last-child{border-bottom:none}
.alt .an{font-weight:500}
.alt .ar{display:block;font-size:13px;color:var(--ink-2);margin-top:1px}
.gain{background:var(--good-bg);color:var(--good);border-radius:6px;padding:9px 12px;margin:10px 0;
  font-size:14px;font-weight:500}
.gain.flat{background:var(--panel-2);color:var(--ink-2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px 15px;margin:11px 0}
.card h2{font-family:Oswald,"Arial Narrow",sans-serif;font-size:14px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;margin:0 0 9px}
.card p{margin:0 0 7px;font-size:14px;color:var(--ink-2)}
.card p:last-child{margin-bottom:0}
.card b{color:var(--ink)}
.card.warn{background:var(--warn-bg);border-color:var(--warn)} .card.warn h2{color:var(--warn)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.07em;
  padding:2px 5px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.t-MEASURED{background:var(--good-bg);color:var(--good)}
.t-THIN{background:var(--warn-bg);color:var(--warn)}
.t-COACHED{background:var(--gold-soft);color:var(--gold)}
.t-NO{background:var(--bad-bg);color:var(--bad)}
.t-SELF{background:var(--panel-2);color:var(--ink-2)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px}
.sl{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--panel-2);min-height:46px}
.sl .lb{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);
  display:flex;justify-content:space-between;gap:4px}
.sl .lb .pkn{color:var(--gold);font-weight:600}
.sl .vl{font-size:13px;font-weight:500;line-height:1.25}
.sl.empty{border-style:dashed;opacity:.55}
.sl.crit{border-color:var(--bad)}
table{width:100%;border-collapse:collapse}
thead th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);text-align:right;padding:5px 3px}
thead th:first-child{text-align:left}
td{padding:7px 3px;border-bottom:1px solid var(--line);font-size:14px;
  font-variant-numeric:tabular-nums;text-align:right}
td:first-child{text-align:left}
tr.lot td{opacity:.6}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel-2)}
/* ---- free agent finder controls ---- */
.modes{display:flex;flex-wrap:wrap;gap:5px}
.modes .mode{flex:1 1 auto;min-width:88px;min-height:40px;padding:8px 9px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line);border-radius:5px;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.06em}
.modes .mode.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.modes .mode:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.ctl{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.ctl label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.ctl select{font-family:"IBM Plex Sans",sans-serif;font-size:14px;padding:6px 8px;min-height:36px;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.step{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:none}
.stepn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ground);
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;display:flex;
  align-items:center;justify-content:center;margin-top:2px}
.stepb{flex:1;min-width:0}
.stept{font-size:17px;line-height:1.3}
.steps2{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;
  padding:5px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);
  border:1px solid var(--line);white-space:nowrap}
.chip b{font-size:12px;color:var(--ink)}
.chip.up{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.chip.up b{color:var(--good)}
.chip.down{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chip.down b{color:var(--bad)}
.hero .nm+.nm{margin-top:-2px}
th.sortable{cursor:pointer;white-space:nowrap}
th.sortable:hover{color:var(--ink)}
th.sortable.on{color:var(--gold)}
th.sortable.on::after{content:" \25BC"}
.pn{display:block;font-weight:500;line-height:1.2}
.pm{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);line-height:1.3}
.pn{font-weight:500} .pm{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);display:block}
.th{display:flex;align-items:baseline;gap:8px;margin:14px 0 3px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.th .tn{font-family:Oswald,"Arial Narrow",sans-serif;font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.th .tc{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 8px}
button.f{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;cursor:pointer;
  background:var(--panel);color:var(--ink-2);border:1px solid var(--line);border-radius:3px;
  padding:7px 11px;min-height:38px}
button.f[aria-pressed="true"]{background:var(--gold);color:var(--ground);border-color:var(--gold)}
button.f:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rank{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rank td{padding:6px 4px;font-size:14px}
.rank tr.me td{color:var(--gold);font-weight:600}
.rank .bar2{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.rank .bar2 i{display:block;height:100%;background:var(--gold)}
.feed{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);max-height:60vh;overflow-y:auto}
.feed div{padding:3px 0;border-bottom:1px solid var(--line)}
.feed .mine{color:var(--gold);font-weight:600}
.mrow{display:flex;gap:6px;margin-top:8px}
.mrow input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  border-radius:4px;padding:11px 10px;font-size:16px;font-family:inherit}
.mrow input:focus{outline:2px solid var(--gold);outline-offset:1px}
.mbtn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:4px;
  padding:11px 13px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;cursor:pointer}
.mbtn.danger{color:var(--bad);border-color:var(--bad)}
.mbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mlist{display:grid;gap:4px;margin-top:10px;max-height:52vh;overflow-y:auto}
.mpick{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;
  background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:11px;
  color:var(--ink);font-family:inherit;font-size:15px;text-align:left;cursor:pointer;min-height:46px}
.mpick:hover{border-color:var(--gold)}
.mpick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.testbar{background:var(--gold);color:var(--ground);border-radius:5px;padding:8px 11px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;margin:9px 0}
.testbar a{color:var(--ground);text-decoration:underline}
.manualbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:5px;
  padding:7px 11px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;margin:8px 0}
.good{background:var(--good-bg);color:var(--good);border:1px solid var(--good);border-radius:5px;
  padding:9px 12px;font-size:13px;margin:9px 0}
.err{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:5px;
  padding:9px 12px;font-size:13px;margin:9px 0}
footer{margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);line-height:1.7}
</style>
<div class="wrap">
<div class="bar">
  <span class="dot" id="dot"></span><span class="st" id="status">connecting</span>
  <span class="rk" id="rank">&mdash;</span>
</div>
<div id="testbar"></div><div id="manualbar"></div><div id="err"></div>
<div id="view"></div>
<footer id="prov"></footer>
</div>
<nav>
  <button data-v="PICK"   aria-pressed="true">PICK</button>
  <button data-v="BOARD"  aria-pressed="false">BOARD</button>
  <button data-v="MOVES"  aria-pressed="false">MOVES</button>
  <button data-v="LINEUP" aria-pressed="false">LINEUP</button>
  <button data-v="TEAM"   aria-pressed="false">TEAM</button>
  <button data-v="LEAGUE" aria-pressed="false">LEAGUE</button>
  <button data-v="RIVALS" aria-pressed="false">RIVALS</button>
  <button data-v="LOG"    aria-pressed="false">LOG</button>
  <button data-v="MANUAL" aria-pressed="false">MANUAL</button>
</nav>
<script>
const CFG=__CFG__, P=__PLAYERS__;
// The in-season pool: every projected player, not just the 260-man draft board.
// 311 of these were invisible to the old free-agency screen, which is the tool
// that exists to find exactly those players.
const FA=__FAPOOL__, FA_META=__FAMETA__;
const QS=new URLSearchParams(location.search);
// Draft id is overridable so this page can be rehearsed against a Sleeper mock
// (or replayed against a finished draft) before it matters. ?draft=<id>
const REAL_DRAFT=CFG.draft_id;
let DRAFT_ID=QS.get('draft')||REAL_DRAFT;
const LEAGUE_ID=QS.get('league')||null;   // rehearsal hatch for the FA screen
const IS_TEST=DRAFT_ID!==REAL_DRAFT;
let API="https://api.sleeper.app/v1/draft/"+DRAFT_ID+"/picks";
const byId={}; P.forEach((p,i)=>{p.i=i; byId[p.id]=p;});

// Live draft shape. Defaults come from the baked real draft; when pointed at
// another draft these are re-derived from that draft's own object, because a
// mock will have a different size, different order, and a different slot for
// you. Last year you drafted from slot 2, not 9 - assuming 9 would be wrong.
let SHAPE={teams:CFG.teams, rounds:CFG.rounds, slot:CFG.slot,
           nameBySlot:CFG.name_by_slot, type:'snake', reversal:0, status:null};
let MYPICKS=[], PICKMAP={};
let picks=[], filt='ALL', lastOk=0, failCount=0;
// ---- manual fallback -------------------------------------------------------
// If Sleeper stops answering, the draft does not stop. Manual entries append to
// whatever the API already gave us and survive a refresh, so the tool keeps
// working from wherever the feed died.
let manual=[];
const MKEY='ld_manual_'+DRAFT_ID;
try{ manual=JSON.parse(localStorage.getItem(MKEY)||'[]'); }catch(e){ manual=[]; }
function saveManual(){ try{ localStorage.setItem(MKEY, JSON.stringify(manual)); }catch(e){} }
function effectivePicks(){
  const base=picks.length;
  const extra=manual.filter(m=>m.pick_no>base)
    .sort((a,b)=>a.pick_no-b.pick_no)
    .map(m=>({pick_no:m.pick_no, player_id:m.id, _manual:true}));
  return picks.concat(extra);
}
function isMinePick(x){
  if(x.picked_by) return x.picked_by===CFG.me_id;
  return PICKMAP[x.pick_no]===SHAPE.slot;
}
function addManual(id){
  const nextNo=effectivePicks().length+1;
  if(nextNo>SHAPE.teams*SHAPE.rounds) return;
  manual.push({id:String(id), pick_no:nextNo}); saveManual(); render();
}
function undoManual(){ if(manual.length){ manual.pop(); saveManual(); render(); } }
function clearManual(){ if(confirm('Clear all '+manual.length+' hand-entered picks?')){ manual=[]; saveManual(); render(); } }

function rebuildPickMap(){
  PICKMAP={}; MYPICKS=[];
  const T=SHAPE.teams, R=SHAPE.rounds;
  for(let r=1;r<=R;r++){
    let order=[]; for(let i=1;i<=T;i++) order.push(i);
    if(SHAPE.type!=='linear' && r%2===0) order.reverse();
    if(SHAPE.reversal && r>=SHAPE.reversal && SHAPE.type!=='linear'){
      // third-round-reversal style: flip the sense from that round on
      order = (r%2===0)? order.slice().reverse() : order.slice().reverse();
    }
    order.forEach((slot,i)=>{ PICKMAP[(r-1)*T+i+1]=slot; });
  }
  for(let k=1;k<=T*R;k++) if(PICKMAP[k]===SHAPE.slot) MYPICKS.push(k);
}
rebuildPickMap();

async function loadDraftShape(){
  try{
    const r=await fetch("https://api.sleeper.app/v1/draft/"+DRAFT_ID,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    const st=d.settings||{};
    SHAPE.teams=st.teams||SHAPE.teams;
    SHAPE.rounds=st.rounds||SHAPE.rounds;
    SHAPE.type=d.type||'snake';
    SHAPE.reversal=st.reversal_round||0;
    SHAPE.status=d.status;
    const ord=d.draft_order||{};
    // A mock often has only your own seat filled. Give every slot a name so the
    // feed never prints "?" for an opponent that simply has not been named.
    const names={};
    for(let sl=1; sl<=SHAPE.teams; sl++) names[sl]='Team '+sl;
    Object.keys(ord).forEach(uid=>{
      const nm=(CFG.user_names&&CFG.user_names[uid]);
      if(nm) names[ord[uid]]=nm;
    });
    SHAPE.nameBySlot=names;
    const mySlot=ord[CFG.me_id];
    const forced=parseInt(QS.get('slot')||'',10);
    if(!isNaN(forced)&&forced>=1&&forced<=SHAPE.teams) SHAPE.slot=forced;
    else if(mySlot) SHAPE.slot=mySlot;
    rebuildPickMap();
    return {ok:true, mySlotFound:!!mySlot};
  }catch(e){ return {ok:false, err:e.message}; }
}

function banner(){
  if(!IS_TEST) return;
  const b=document.getElementById('testbar');
  if(b) b.innerHTML='<div class="testbar">REHEARSAL &mdash; watching draft '+DRAFT_ID+
    ', not your real one. Slot '+SHAPE.slot+' of '+SHAPE.teams+', '+SHAPE.rounds+' rounds'+
    (SHAPE.status?(' &middot; '+SHAPE.status):'')+
    '. <a href="'+location.pathname+'">back to the real draft</a></div>';
}

function mgrAt(k){ return SHAPE.nameBySlot[PICKMAP[k]]; }
function basisTag(m){
  // Basis labels describe THIS league's managers. In a rehearsal against a mock
  // or another draft the opponents are strangers, and stamping "MEASURED" on a
  // stranger would be exactly the false-confidence this project exists to avoid.
  const b=CFG.basis[m];
  if(!b) return '<span class="tag t-NO">NOT IN YOUR LEAGUE</span>';
  const c=b==='NO HISTORY'?'t-NO':'t-'+b;
  return '<span class="tag '+c+'">'+b+'</span>';}

// ---- Monte Carlo over the intervening picks -------------------------------
// Rank-based: each manager perceives worth as ADP + noise and takes the best
// board player available. A density-around-ADP model was tried and rejected -
// it made a player who slipped past his ADP LESS likely to go, so elite players
// survived rounds they never survive. K_SPREAD is multiplicative (validated:
// reproduces FFC's observed spread across 6,978 drafts to within 2%, and
// reproduces Bijan's observed pick range of 1..6 exactly).
const K_SPREAD=1.4;
let _g2=null;
function gauss(){
  if(_g2!==null){const g=_g2;_g2=null;return g;}
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  const r=Math.sqrt(-2*Math.log(u)), t=2*Math.PI*v;
  _g2=r*Math.sin(t); return r*Math.cos(t);
}
function simulate(pool, from, to, sims){
  const n=pool.length, surv=new Float64Array(n), masks=[];
  const adp=new Float64Array(n), sd=new Float64Array(n);
  for(let i=0;i<n;i++){adp[i]=pool[i].adp; sd[i]=Math.max(pool[i].sd,0.5)*K_SPREAD;}
  const scales=new Float64Array(to+2);
  for(let k=from+1;k<to;k++) scales[k]=CFG.noise[mgrAt(k)]||1.0;
  for(let s=0;s<sims;s++){
    const alive=new Uint8Array(n).fill(1);
    for(let k=from+1;k<to;k++){
      const sc=scales[k]; let best=-1,bv=Infinity;
      const bias=0;   // measured to be noise - see readRoom()
      for(let i=0;i<n;i++){
        if(!alive[i])continue;
        const v=adp[i]+bias+gauss()*sd[i]*sc;
        if(v<bv){bv=v;best=i;}
      }
      if(best<0)break;
      alive[best]=0;
    }
    for(let i=0;i<n;i++) if(alive[i]) surv[i]++;
    masks.push(alive);
  }
  for(let i=0;i<n;i++) surv[i]/=sims;
  return {surv,masks};
}


// ============================ league structure ============================
// Dedicated slots only. FLEX can be filled by any of RB/WR/TE, so "spare" is
// measured against the slots that REQUIRE a given position - those are the ones
// an injury can leave literally unfillable.
const REQ={QB:1,RB:2,WR:2,TE:1}, NFLEX=3;
// Observed roster shapes, MEASURED, not chosen: last year's 12 real managers in
// this league finished QB 1-2, RB 4-7, WR 5-7, TE 1-3 (mean 1.9/5.0/6.2/1.8).
// The tool's first mock ended 2 RB / 5 TE - the only team in the room outside
// those bounds at either position. These caps stop that recurring.
const POSCAP={QB:2,RB:6,WR:7,TE:3}, POSTARGET={QB:2,RB:5,WR:6,TE:2};
const FALLBACK_SR={QB:0.46,RB:0.53,WR:0.56,TE:0.36};
// RB_TILT: a small standing preference for running backs, worth 5 points of VOR.
// Not a script and not a hunch. Backtested on TWO independent seasons, drafting
// off that year's ADP and scored on what players ACTUALLY did:
//   2025  RB-early 2090 / 43% contending   vs balanced 1975 / 25%
//   2024  RB-early 2116 / 52% contending   vs balanced 2008 / 31%
// Zero RB was worst in both years (7% and 12%). Independently, ESPN projects
// top-60 backs +29.6 points above Rotowire, and it is ESPN's view that matched
// outcomes - so the blend still under-rates backs a little.
// Size chosen by test, not taste: +5 is NEUTRAL on the blend (2144.4 vs 2144.0)
// while helping under ESPN; +10 and above start costing real points.
const RB_TILT=5;
// STREAMABLE: how replaceable a position is off waivers if a starter goes down.
// The bench rule used to weight "zero spare" identically everywhere, so a backup
// QB scored the same as a third RB when you held two. In a 1-QB league roughly
// 23 quarterbacks get drafted, leaving QB13+ on the wire all season - a backup
// QB is nearly free, a backup RB is not. Predicted before mock #4 that this
// would waste a pick; it then spent 10.04 on Bo Nix, who projects BELOW the
// starter and can never crack the lineup, while Wan'Dale Robinson (173 blend,
// startable in 75% of 2025 weeks) sat on the board.
// The starters-only harness is blind to this - bench picks do not change the
// starting lineup - so it was tuned against an injury-adjusted score instead
// (each drafted player independently missing the season with p=0.18):
//   uniform 1.0      1984.1
//   QB.5 TE.8        1984.6
//   QB.3 TE.55       1987.1
//   QB.15 TE.4       1989.1   <- peak, and zero cost on starters (2143.4 either way)
//   QB.08 TE.3       1982.2   <- past the peak, roster shape starts degrading
// Corrected after the real draft. 0.15 was tuned against an injury-adjusted
// simulation that assumed NO WAIVER WIRE - in that world a backup QB has real
// value. In this league Trevor Lawrence sat unrostered at a 94% 10-point rate
// while the engine spent 13.09 on Baker Mayfield (88%) over Keenan Allen, who
// went one pick later. The cover differential (2.00 for a "scarce" QB vs 0.078
// for a fifth WR) is 26x, which 0.15 could never close.
const STREAMABLE={QB:0.03,TE:0.40,WR:1.0,RB:1.0};
function tilt(p){ return p.pos==='RB'?RB_TILT:0; }
// Designation severity. PUP and IR mean weeks missed, not a game-time call, and
// a regular-season PUP player cannot play at all early. Treating those the same
// as Questionable is how a tool recommends a man who will not take the field.
const INJ_MULT={'PUP':0.25,'IR':0.15,'OUT':0.3,'SUS':0.3,'DOUBTFUL':0.55,'NA':0.5,'QUESTIONABLE':0.94};
function injMult(p){ if(!p.inj) return 1; return INJ_MULT[String(p.inj).toUpperCase()]!==undefined?INJ_MULT[String(p.inj).toUpperCase()]:0.85; }
function injSevere(p){ return p.inj && ['PUP','IR','OUT','SUS','DOUBTFUL','NA'].includes(String(p.inj).toUpperCase()); }

function daysAgo(ms){
  const d=Math.floor((Date.now()-ms)/86400000);
  return d<=0?'today':(d===1?'yesterday':d+' days ago');
}
function rp(k){const T=SHAPE.teams;return Math.ceil(k/T)+'.'+String(((k-1)%T)+1).padStart(2,'0');}

// ============================ rosters and lineups =========================
function lineupOf(list){
  const pool=list.slice().sort((a,b)=>b.pts-a.pts), used=new Set(), line={QB:[],RB:[],WR:[],TE:[],FLEX:[],BN:[]};
  Object.keys(REQ).forEach(pos=>{
    for(let i=0;i<pool.length && line[pos].length<REQ[pos];i++){
      if(used.has(i)||pool[i].pos!==pos) continue; line[pos].push(pool[i]); used.add(i);
    }
  });
  for(let i=0;i<pool.length && line.FLEX.length<NFLEX;i++){
    if(used.has(i)||!['RB','WR','TE'].includes(pool[i].pos)) continue; line.FLEX.push(pool[i]); used.add(i);
  }
  pool.forEach((p,i)=>{ if(!used.has(i)) line.BN.push(p); });
  let total=0; ['QB','RB','WR','TE','FLEX'].forEach(k=>line[k].forEach(p=>total+=p.pts));
  return {line,total};
}
function lineupBy(list, val){
  const pool=list.map(p=>({pos:p.pos, pts:val(p)})).sort((a,b)=>b.pts-a.pts);
  const used=new Set(); let tot=0;
  Object.keys(REQ).forEach(pos=>{ let c=0;
    for(let i=0;i<pool.length && c<REQ[pos];i++){ if(used.has(i)||pool[i].pos!==pos) continue; used.add(i); tot+=pool[i].pts; c++; }});
  let f=0;
  for(let i=0;i<pool.length && f<NFLEX;i++){ if(used.has(i)||!['RB','WR','TE'].includes(pool[i].pos)) continue; used.add(i); tot+=pool[i].pts; f++; }
  return tot;
}
// The tool optimises the blend, so ranking by the blend is partly circular.
// These are the same rosters scored by each source on its own, and by the
// market, so a first place that only exists in one valuation is visible as such.
const VALUATIONS={
  blend:{label:'Blend', f:p=>p.pts},
  roto :{label:'Rotowire', f:p=>(p.roto!=null?p.roto:p.pts)},
  espn :{label:'ESPN', f:p=>(p.espn!=null?p.espn:p.pts)},
  market:{label:'Market', f:p=>Math.max(0,300-(p.adp||300))}
};
function allTeams(EFF){
  const bySlot={};
  for(let s=1;s<=SHAPE.teams;s++) bySlot[s]=[];
  EFF.forEach(x=>{
    const slot=PICKMAP[x.pick_no]; const p=byId[String(x.player_id)];
    if(slot&&p) bySlot[slot].push(Object.assign({},p,{_pick:x.pick_no,_manual:!!x._manual}));
  });
  const rows=Object.keys(bySlot).map(s=>{
    const {line,total}=lineupOf(bySlot[s]);
    const alt={};
    Object.keys(VALUATIONS).forEach(k=>{ alt[k]=lineupBy(bySlot[s], VALUATIONS[k].f); });
    return {slot:+s,total,line,players:bySlot[s],alt,name:SHAPE.nameBySlot[s]||('Team '+s)};
  }).sort((a,b)=>b.total-a.total);
  rows.forEach((r,i)=>r.rank=i+1);
  Object.keys(VALUATIONS).forEach(k=>{
    const ord=rows.slice().sort((a,b)=>b.alt[k]-a.alt[k]);
    ord.forEach((r,i)=>{ r['rank_'+k]=i+1; });
  });
  return rows;
}
function depthOf(players){
  const d={QB:0,RB:0,WR:0,TE:0}; players.forEach(p=>{ if(d[p.pos]!==undefined) d[p.pos]++; });
  return d;
}
function startersFilled(line){
  return line.QB.length+line.RB.length+line.WR.length+line.TE.length+line.FLEX.length;
}

// ============================ candidate scoring ===========================
function fillsStarter(p,depth,line){
  if(depth[p.pos]<REQ[p.pos]) return true;
  return line.FLEX.length<NFLEX && ['RB','WR','TE'].includes(p.pos);
}
function upside(p){ return (p.sr!=null? p.sr : FALLBACK_SR[p.pos]||0.4); }
// Bench value is NOT VOR. Once the 9 starting slots are full, a player's worth
// is what he covers when a starter goes down - and a position you already have
// four of covers nothing. This is the rule whose absence produced 5 TEs.
function benchScore(p,depth){
  const spare=depth[p.pos]-REQ[p.pos];
  let cover;
  if(spare<0) cover=3.0;            // cannot even field the slot today
  else if(spare===0) cover=2.0;     // no backup at all behind a mandatory slot
  else if(spare===1) cover=0.9;
  else cover=Math.pow(0.28,spare-1);
  if(depth[p.pos]>=POSTARGET[p.pos]) cover*=0.35;
  if(depth[p.pos]>=POSCAP[p.pos])    cover*=0.05;
  cover*=(STREAMABLE[p.pos]!==undefined?STREAMABLE[p.pos]:1.0);
  return cover*(upside(p)*100 + (p.ceil||0)*1.2)*injMult(p);
}

// ============================ plain-language why ==========================
function whyNot(top,alt,ctx,topC,altC){
  const sv=ctx.survMap||{}, np=ctx.nextPick;
  const st=sv[top.id], sa=sv[alt.id];
  const d=(topC&&altC)?(topC.score-altC.score):null;
  const bits=[];
  if(d!=null&&d>0.5) bits.push('leaves you <b>'+d.toFixed(0)+'</b> worse off by '+(np?rp(np):'your next pick'));
  if(np&&sa!=null&&st!=null){
    if(sa>=0.6&&st<0.35) bits.push('and <b>'+Math.round(sa*100)+'%</b> he is still here at '+rp(np)+' anyway');
    else if(sa<0.2&&st<0.2) bits.push('both of them likely gone by '+rp(np));
    else if(sa!=null) bits.push(Math.round(sa*100)+'% he lasts to '+rp(np));
  }
  if(!bits.length) bits.push(ctx.phase==='BENCH'?'less cover where you are thin':'lower value at the same slot');
  return bits.join(', ');
}
function reasonsFor(p,ctx){
  const out=[];
  const {depth,line,avail,survMap,nextPick,phase,tierLeft,nextTierDrop}=ctx;
  if(phase==='STARTERS'){
    if(depth[p.pos]<REQ[p.pos]){
      const n=REQ[p.pos]-depth[p.pos];
      out.push('Fills your empty <b>'+p.pos+(REQ[p.pos]>1?String(depth[p.pos]+1):'')+'</b> slot'+(n>1?' (you need '+n+')':''));
    } else if(line.FLEX.length<NFLEX){
      out.push('Goes straight into a <b>FLEX</b> slot &mdash; you have '+(NFLEX-line.FLEX.length)+' open');
    }
  }
  // How much of this tier survives to his next pick? This is the honest form of
  // "will it get cleaned out" - counted from the same simulation as survival,
  // not from folklore about runs.
  if(survMap&&nextPick&&tierLeft!=null&&tierLeft>1){
    const same=avail.filter(q=>q.tier===p.tier&&survMap[q.id]!=null);
    if(same.length>=2){
      const exp=same.reduce((a,q)=>a+(survMap[q.id]||0),0);
      const gone=same.length-exp;
      if(gone>=1.0){
        const pctPosLeft=avail.filter(q=>q.pos===p.pos&&(survMap[q.id]||0)>=0.5).length;
        out.push('Tier '+p.tier+' has <b>'+same.length+'</b> left and about <b>'+gone.toFixed(0)+
          '</b> of them go before '+rp(nextPick)+' &mdash; roughly <b>'+Math.max(0,Math.round(exp))+
          '</b> survive'+(pctPosLeft<=3?', and only '+pctPosLeft+' '+p.pos+'s anywhere are better than a coin flip to last':''));
      }
    }
  }
  if(tierLeft!=null){
    if(tierLeft===1) out.push('<b>Last man in tier '+p.tier+'</b>'+(nextTierDrop?' &mdash; the next tier is '+Math.round(nextTierDrop)+' points lower':''));
    else if(tierLeft<=3) out.push('Only <b>'+tierLeft+' left</b> in tier '+p.tier+' before the drop');
  }
  const sv=survMap?survMap[p.id]:null;
  if(sv!=null&&nextPick&&phase!=='BENCH'){
    const pc=Math.round(sv*100);
    if(pc<=25) out.push('<b>'+pc+'%</b> he lasts to your next pick ('+rp(nextPick)+') &mdash; take him now or lose him');
    else if(pc>=60) out.push('Not urgent: <b>'+pc+'%</b> he lasts to '+rp(nextPick)+
      ' &mdash; he leads because nothing better fills this slot, not because he is about to go');
    else out.push('<b>'+pc+'%</b> he lasts to '+rp(nextPick)+' &mdash; genuine coin flip');
  }
  if(phase==='BENCH'){
    const spare=depth[p.pos]-REQ[p.pos];
    if(spare<0) out.push('<b>You cannot field a legal lineup at '+p.pos+'</b> &mdash; you have '+depth[p.pos]+' for '+REQ[p.pos]+' required slots');
    else if(spare===0) out.push('<b>Zero spare '+p.pos+'.</b> One injury leaves that slot empty');
    else out.push('Depth pick &mdash; you already have '+depth[p.pos]+' at '+p.pos);
    if(p.pos==='QB'&&depth.QB>=1) out.push('A backup QB is close to free here &mdash; about 23 go in a 12-team 1-QB league, so QB13 and below sit on waivers all year');
    if(p.sr!=null) out.push('Was startable in <b>'+Math.round(p.sr*100)+'% of weeks</b> last season'+(p.ceil?', ceiling '+p.ceil:''));
    else out.push('No 2025 history, so upside here is <b>unmeasured</b> &mdash; positional average assumed');
    if(sv!=null&&nextPick) out.push(Math.round(sv*100)+'% he lasts to '+rp(nextPick));
  }
  if(p.inj && !ctx.isTop) out.unshift('<b style="color:var(--bad)">'+String(p.inj).toUpperCase()+
    (p.injb?' ('+p.injb+')':'')+'</b> per Sleeper');
  else if(p.dcp&&p.dco&&p.dco>=3) out.push('Listed <b>'+p.dcp+'</b> on the depth chart &mdash; behind '+(p.dco-1)+' at his spot');
  else if(p.dcp&&p.dco===1&&ctx.phase==='BENCH') out.push('Listed <b>'+p.dcp+'</b> &mdash; a starter\u2019s role, not a handcuff');
  if(p.floor!=null&&p.ceil!=null&&ctx.phase!=='BENCH'){
    const swing=p.ceil-p.floor;
    if(swing>=13) out.push('Volatile: 2025 weeks ranged <b>'+p.floor+'</b> to <b>'+p.ceil+
      '</b> &mdash; a boom/bust start, not a floor play');
    else if(p.sr!=null&&p.sr>=0.75) out.push('Steady: startable in <b>'+Math.round(p.sr*100)+
      '%</b> of 2025 weeks, floor '+p.floor);
  }
  if(p.newsflag==='boost') out.unshift('<b style="color:var(--good)">Recent news in his favour</b> &mdash; see the note below');
  if(p.ffc&&p.sl&&(p.ffc-p.sl)>=12) out.push('<b>Sleeper drafters take him '+Math.round(p.ffc-p.sl)+
    ' picks earlier</b> than the mock-draft market. Survival below already uses the average of both.');
  if(p.pos==='RB'&&ctx.phase==='STARTERS') out.push('Backs carry a small standing edge here: on 2024 and 2025 outcomes, RB-early drafting beat balanced in both years, and Zero RB was worst in both');
  if(p.espn==null) out.push('<b>Only one source has him.</b> Rotowire projects him; ESPN does not, so this number has no second opinion behind it');
  else if(Math.abs(p.gap)>=35) out.push('Sources disagree hard: Rotowire <b>'+p.roto.toFixed(0)+'</b> vs ESPN <b>'+
    p.espn.toFixed(0)+'</b>. The number above is their average, so it is '+(p.gap>0?'ESPN':'Rotowire')+' pulling it up');
  const left=avail.filter(q=>q.pos===p.pos && q.vor>=p.vor-12).length;
  if(phase==='STARTERS'&&left<=4) out.push('Only <b>'+left+'</b> '+p.pos+(left===1?'':'s')+' left within 12 points of him');
  const mineByes={}; [].concat(line.QB,line.RB,line.WR,line.TE,line.FLEX).forEach(q=>{ if(q&&q.bye) mineByes[q.bye]=(mineByes[q.bye]||0)+1; });
  if(p.bye&&(mineByes[p.bye]||0)>=2) out.push('Careful: <b>'+((mineByes[p.bye]||0)+1)+' of your starters</b> would share the week '+p.bye+' bye');
  return out.slice(0,4);
}

// ============================ the recommendation ==========================
const SIMS=2500;
// A pick is worth what it leaves you with, not just what it is. Scoring a
// candidate on its own VOR alone made the engine take five straight receivers
// into FLEX slots and then fill two MANDATORY running-back slots with whatever
// survived to round 9. The continuation term prices that: for each candidate we
// average, over every simulated continuation, the best thing still on the board
// at the next pick GIVEN that candidate is now on the roster.
function openFlexAfter(d){
  let used=0; ['RB','WR','TE'].forEach(k=>{ used+=Math.max(0,(d[k]||0)-REQ[k]); });
  return NFLEX-used;
}
function fillsAfter(q,d){
  if((d[q.pos]||0)<REQ[q.pos]) return true;
  return openFlexAfter(d)>0 && ['RB','WR','TE'].includes(q.pos);
}
function recommend(avail,cur,target,st,isMine){
  const pool=avail.filter(p=>p.adp&&p.adp<=target+45).slice(0,110);
  let survMap={}, masks=null, sims=0;
  if(pool.length&&target>cur){
    const r=simulate(pool,cur,target,SIMS);
    pool.forEach((p,i)=>survMap[p.id]=r.surv[i]);
    masks=r.masks; sims=SIMS;
  }
  const phase=startersFilled(st.line)>=9?'BENCH':'STARTERS';
  let cands;
  if(phase==='STARTERS'){
    let base=avail.filter(p=>fillsStarter(p,st.depth,st.line));
    if(!base.length) base=avail.slice(0,10);
    base=base.slice(0,12);
    cands=base.map(p=>{
      const d2=Object.assign({},st.depth); d2[p.pos]=(d2[p.pos]||0)+1;
      let cont=0, lows=[];
      if(masks){
        for(let s2=0;s2<sims;s2++){
          const m=masks[s2]; let best=null;
          for(let i=0;i<pool.length;i++){
            if(!m[i]) continue; const q=pool[i];
            if(q.id===p.id) continue;
            if(!fillsAfter(q,d2)) continue;
            if(best===null||q.vor>best) best=q.vor;
          }
          if(best===null) best=0;
          cont+=best; lows.push(best);
        }
        cont/=sims; lows.sort((a,b)=>a-b);
      }
      const p10=lows.length?p.vor+lows[Math.floor(lows.length*0.10)]:p.vor;
      return {p,score:(p.vor+tilt(p)+cont)*injMult(p),cont,p10,med:p.vor+cont};
    });
  }else{
    cands=avail.slice(0,90).map(p=>({p,score:benchScore(p,st.depth),cont:0,p10:null,med:null}));
  }
  if(!isMine){
    const likely=cands.filter(c=>(survMap[c.p.id]||0)>=0.5);
    cands=(likely.length?likely:cands.filter(c=>(survMap[c.p.id]||0)>=0.2));
    if(!cands.length) cands=avail.slice(0,4).map(p=>({p,score:p.vor,cont:0,p10:null,med:null}));
  }
  cands.sort((a,b)=>b.score-a.score);
  // The same board, ranked by each source on its OWN replacement levels. One
  // survival sim serves all three, because survival depends on ADP, not on whose
  // projection you believe.
  const alt={};
  ['vr','ve'].forEach(k=>{
    let c2;
    if(phase==='STARTERS'){
      c2=avail.filter(p=>fillsStarter(p,st.depth,st.line) && p[k]!=null);
      if(!c2.length) c2=avail.filter(p=>p[k]!=null);
      c2=c2.slice(0,40).map(p=>({p,score:p[k]+tilt(p)}));
    }else{
      c2=avail.slice(0,90).filter(p=>p[k]!=null).map(p=>({p,score:benchScore(p,st.depth)}));
    }
    if(!isMine) c2=c2.filter(c=>(survMap[c.p.id]||0)>=0.5).length
                  ? c2.filter(c=>(survMap[c.p.id]||0)>=0.5) : c2;
    c2.sort((a,b)=>b.score-a.score);
    alt[k]=c2.length?c2[0].p:null;
  });
  return {cands:cands.slice(0,4),survMap,phase,pool,alt};
}

// NOTE: a full-draft rollout was built and tested here - play the whole draft
// out for each candidate, with our own future picks made greedily, and score the
// final lineup. It did NOT beat the one-step continuation term: over three
// replays of the same mock it returned 2073/2080/2074 against 2073/2081/2081,
// i.e. indistinguishable, at roughly double the compute. Removed rather than
// shipped. The reason it adds nothing is that our own future picks are greedy in
// both engines, so the extra lookahead carries no new information.

// ============================ reading the room ===========================
// The survival model starts from ADP. That is a prior, not a fact, and a sharp
// manager who reaches will break it. So measure what each seat is ACTUALLY doing
// in THIS draft and feed it back. Shrunk toward the pool, because two picks is
// not evidence: weight = n/(n+K).
const SHRINK_K=4;
let BIAS={};      // slot -> picks of bias (negative = takes players earlier than ADP)
let RUN=null;     // current positional run, if any
function readRoom(EFF){
  const bySlot={};
  EFF.forEach(x=>{
    const p=byId[String(x.player_id)]; if(!p||!p.adp) return;
    const slot=PICKMAP[x.pick_no]; if(!slot) return;
    (bySlot[slot]=bySlot[slot]||[]).push(x.pick_no-p.adp);
  });
  BIAS={};
  Object.keys(bySlot).forEach(s=>{
    const v=bySlot[s], n=v.length;
    const mean=v.reduce((a,b)=>a+b,0)/n;
    BIAS[s]={n, raw:mean, bias:mean*(n/(n+SHRINK_K))};
  });
  // positional run over the last 8 picks
  const tail=EFF.slice(-8).map(x=>byId[String(x.player_id)]).filter(Boolean);
  RUN=null;
  if(tail.length>=6){
    const c={}; tail.forEach(p=>c[p.pos]=(c[p.pos]||0)+1);
    const best=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
    if(c[best]>=5) RUN={pos:best,count:c[best],of:tail.length};
  }
  return BIAS;
}
// biasAt is deliberately NOT used by the simulator any more. Tested on last
// year's 180 picks:
//   split-half (R1-7 reach vs R8-15 reach)      r = -0.289
//   lag-1 autocorrelation between a manager's
//   consecutive picks                            r = +0.173
//   running-mean-so-far vs their NEXT pick       r = +0.010   <- what this assumed
// A manager's reach so far predicts essentially nothing about their next pick,
// so feeding it into survival moved the numbers on noise. Reach is still SHOWN,
// because it is a true statement about what has happened - it just is not
// evidence about what happens next.
function biasAt(k){ const b=BIAS[PICKMAP[k]]; return b?b.bias:0; }

// ============================ free agency ================================
// Rebuilt as a real Free Agent Finder. The old version ranked the 260-man DRAFT
// board on last season's 10-point rate. Two things were wrong with that in
// September: the board is not the wire (311 projected players were invisible to
// it), and a 2025 rate is evidence about a role a player may no longer have.
//
// This version asks the question the way you actually ask it, and makes you pick
// WHICH question: help me this week, help me next week, help me the rest of the
// way, fill a specific bye, or swing for a ceiling. Draft Sharks call this
// Suggested Moves; the framing is theirs and it is the right one. The numbers
// underneath are ours and each carries its basis.
//
// League is waiver_type 2 - first come, first served, no FAAB - so this screen is
// built for speed on a phone, not for a desktop spreadsheet.
let ROSTERED=null, MYROSTER=null, faLoaded=0, FA_SOURCE='';
let NFLSTATE=null, FA_MODE='now', FA_WEEK=null, FA_POS='ALL', FA_SORT=null, FA_DESC=true;

// Sleeper's own state endpoint. season_type matters: during August it returns
// week 3 with season_type "pre". Reading that as regular-season week 3 would be
// a plausible number nobody checked, which is how this project breaks.
async function loadState(){
  try{
    const r=await fetch('https://api.sleeper.app/v1/state/nfl',{cache:'no-store'});
    if(r.ok) NFLSTATE=await r.json();
  }catch(e){ NFLSTATE=null; }
  const reg = NFLSTATE && NFLSTATE.season_type==='regular';
  if(FA_WEEK===null) FA_WEEK = reg ? Math.min(18,Math.max(1,NFLSTATE.week)) : 1;
  return NFLSTATE;
}
function regularSeason(){ return !!(NFLSTATE && NFLSTATE.season_type==='regular'); }

// ---- weekly projection access -------------------------------------------
// null means NOT PROJECTED (bye week, or no projection issued). It is never 0.
// Coercing the two together is how a player on bye looks merely bad instead of
// unavailable.
function wp(p,wk){
  if(!p||!p.wp) return null;
  const v=p.wp[String(wk)];
  return (v===undefined||v===null)?null:v;
}
function onBye(p,wk){ return p&&p.bye===wk; }
// SEASON-PRORATED weekly value. Sleeper's per-week projection and its own season
// projection do NOT agree: summed over 18 weeks the weekly numbers run about 9%
// high at the median, and up to 2.4x for individuals - every one of the worst
// offenders a quarterback with a job he might lose (Watson 2.42, Tua 2.36,
// Brissett 1.83, Rodgers 1.66). They are answering different questions. The
// weekly number is conditional on him PLAYING that week; the season number
// prices in the chance he does not hold the role all year.
// So: single-week questions use the weekly projection, and anything cumulative
// uses the season projection spread over the 17 weeks he actually plays. Summing
// weeklies to make a season number would quietly inflate exactly the players
// whose playing time is least certain.
const _SPW=new WeakMap();
function spw(p,wk){
  if(!p||p.pts==null) return null;
  let a=_SPW.get(p);
  if(!a){
    // 19 slots so the week number indexes directly; null means NOT PLAYING that
    // week, which must stay distinguishable from a projection of zero.
    a=new Array(19).fill(p.pts/17.0);
    if(p.bye) a[p.bye]=null;
    a[0]=null;
    _SPW.set(p,a);
  }
  return a[wk]===undefined?null:a[wk];
}
// Best legal lineup for ONE week, from weekly projections. A player with no
// projection that week cannot be started, so he is simply not in the pool.
function weekLineup(list,wk,valf){
  const f=valf||wp;
  const pool=list.map(p=>({p,v:f(p,wk)})).filter(x=>x.v!==null)
                 .sort((a,b)=>b.v-a.v);
  const used=new Set(), line={QB:[],RB:[],WR:[],TE:[],FLEX:[]};
  Object.keys(REQ).forEach(pos=>{
    for(let i=0;i<pool.length&&line[pos].length<REQ[pos];i++){
      if(used.has(i)||pool[i].p.pos!==pos) continue; line[pos].push(pool[i]); used.add(i);
    }
  });
  for(let i=0;i<pool.length&&line.FLEX.length<NFLEX;i++){
    if(used.has(i)||!['RB','WR','TE'].includes(pool[i].p.pos)) continue; line.FLEX.push(pool[i]); used.add(i);
  }
  let total=0,filled=0;
  Object.keys(line).forEach(k=>line[k].forEach(x=>{total+=x.v;filled++;}));
  return {line,total,filled,legal:filled>=9};
}
function rosLineup(list,fromWk){
  // Rest of season = sum of weekly best-legal lineups, not the season total of
  // your best nine. That difference IS the bye-week cost, and it is the same
  // quantity the draft engine will need when bye-aware construction gets built.
  let t=0, weeks=0, shortWeeks=[];
  for(let w=fromWk;w<=18;w++){
    const L=weekLineup(list,w,spw);
    if(L.filled===0) continue;
    t+=L.total; weeks++;
    if(!L.legal) shortWeeks.push(w);
  }
  return {total:t,weeks,shortWeeks};
}

async function loadRosters(){
  const EFF=effectivePicks();
  const fromDraft=new Set(EFF.map(x=>String(x.player_id)));
  const mineFromDraft=EFF.filter(isMinePick).map(x=>String(x.player_id));
  let owned=fromDraft, mine=mineFromDraft, src='the draft';
  try{
    const r=await fetch('https://api.sleeper.app/v1/league/'+(LEAGUE_ID||CFG.league_id)+'/rosters',{cache:'no-store'});
    if(r.ok){
      const rs=await r.json();
      const lg=new Set(); let lgMine=[];
      rs.forEach(x=>{
        (x.players||[]).forEach(pid=>lg.add(String(pid)));
        if(x.owner_id===CFG.me_id) lgMine=(x.players||[]).map(String);
      });
      if(lg.size>0){
        // Once the draft is COMPLETE the league roster is the only truth, because
        // it is the only thing that knows about drops. Unioning the draft record
        // in made every player anyone ever drafted permanently "rostered" - so a
        // man drafted and then cut could never reappear on the wire. That was
        // live: Colby Parkinson was dropped after the draft, sat unrostered with
        // a MEASURED 46% ten-point rate - better than anything on this bench -
        // and the free-agency screen could not see him.
        // Before the draft ends, or in a mock (which is attached to no league),
        // the draft picks still have to be merged in or players taken seconds ago
        // look available.
        const done = effectivePicks().length >= SHAPE.teams*SHAPE.rounds;
        if(!done) fromDraft.forEach(id=>lg.add(id));
        owned=lg; src = done ? 'league rosters (live, drops included)' : 'league rosters + draft';
        if(lgMine.length) mine=lgMine;
      }
    }
  }catch(e){ /* draft-derived view stands */ }
  ROSTERED=owned; MYROSTER=mine; FA_SOURCE=src; faLoaded=Date.now();
  return owned.size>0||EFF.length>0;
}

// ---- the five questions --------------------------------------------------
const FA_MODES={
  now :{lb:'THIS WEEK',   hint:'Who raises my score in week %W%.'},
  next:{lb:'NEXT WEEK',   hint:'Who to grab NOW for week %W%, before the room notices.'},
  ros :{lb:'REST OF SEASON', hint:'Who helps most from week %W% to the end, counted week by week.'},
  bye :{lb:'BYE FILLER',  hint:'Who can actually play in week %W%, when your starters cannot.'},
  ceil:{lb:'CEILING',     hint:'Biggest measured upside, skill positions first. 2025 evidence only &mdash; never projected. VS YOURS compares him to your best measured ceiling at the same position.'}
};
function faTargetWeek(){
  if(FA_MODE==='next') return Math.min(18,FA_WEEK+1);
  return FA_WEEK;
}
function myPlayers(){ return (MYROSTER||[]).map(id=>FA[id]).filter(Boolean); }
// What is he worth if your guy goes down? Drop your best player at his position
// and re-ask. If you are already two deep at quarterback, a third one answers
// "nothing" - which is the whole lesson of the 13.09 pick, computed instead of
// assumed. Without this the wire ranks by raw weekly points and quarterbacks,
// who put up the biggest numbers and of whom you start exactly one, fill the
// screen with players who can never enter your lineup.
function coverGain(mine,p,wk){
  const same=mine.filter(q=>q.pos===p.pos);
  if(!same.length) return weekLineup(mine.concat([p]),wk).total-weekLineup(mine,wk).total;
  let best=same[0];
  same.forEach(q=>{ if((wp(q,wk)||0)>(wp(best,wk)||0)) best=q; });
  const without=mine.filter(q=>q!==best);
  return weekLineup(without.concat([p]),wk).total-weekLineup(without,wk).total;
}

function faRows(){
  if(!ROSTERED) return null;
  const mine=myPlayers();
  const wk=faTargetWeek();
  const rows=[];
  Object.keys(FA).forEach(pid=>{
    if(ROSTERED.has(pid)) return;
    const p=FA[pid];
    if(FA_POS!=='ALL'&&p.pos!==FA_POS) return;
    const r={id:pid,p:p,wkproj:wp(p,wk)};
    if(FA_MODE==='ceil'){
      // MEASURED only. A ceiling we did not measure is not a ceiling.
      if(p.mb!=='M'||p.ceil==null) return;
      r.score=p.ceil; r.basis='MEASURED 2025';
      // Your own best MEASURED ceiling at his position, so the number on screen
      // is a comparison and not just a big figure. Left null when you hold
      // nobody measured there - that is a real gap, not a zero.
      const same=mine.filter(q=>q.pos===p.pos&&q.ceil!=null);
      r.mineCeil = same.length? Math.max.apply(null,same.map(q=>q.ceil)) : null;
      r.beats = (r.mineCeil==null)? null : +(p.ceil-r.mineCeil).toFixed(1);
    }else if(FA_MODE==='ros'){
      const base=rosLineup(mine,FA_WEEK).total;
      r.score=rosLineup(mine.concat([p]),FA_WEEK).total-base;
      r.cover=coverGain(mine,p,wk);
      r.basis='projection';
    }else{
      // now / next / bye all ask the same thing about one specific week
      const base=weekLineup(mine,wk);
      const withHim=weekLineup(mine.concat([p]),wk);
      r.score=withHim.total-base.total;
      r.cover=coverGain(mine,p,wk);
      r.starts=withHim.line.QB.concat(withHim.line.RB,withHim.line.WR,withHim.line.TE,withHim.line.FLEX)
                     .some(x=>x.p===p);
      const wasIn=new Set(['QB','RB','WR','TE','FLEX'].flatMap(k=>base.line[k].map(x=>x.p.n)));
      const nowIn=new Set(['QB','RB','WR','TE','FLEX'].flatMap(k=>withHim.line[k].map(x=>x.p.n)));
      r.bumped=[...wasIn].filter(n=>!nowIn.has(n))[0]||null;
      r.basis='projection';
      if(FA_MODE==='bye'&&r.wkproj===null) return;   // cannot fill a week he is not playing
    }
    rows.push(r);
  });
  const key=FA_SORT;
  if(key){
    rows.sort((a,b)=>{
      const va=faCell(a,key,true), vb=faCell(b,key,true);
      if(va===null&&vb===null) return 0;
      if(va===null) return 1; if(vb===null) return -1;
      return FA_DESC?(vb-va):(va-vb);
    });
  }else{
    // Rank on lineup gain; break ties on COVER, not on raw points. Early in the
    // week nobody improves a healthy lineup, so every gain is 0.00 and the
    // tiebreak is doing all the work - it must not be "who scores most", or the
    // list is quarterbacks you cannot start.
    // Tiebreak chain, in the open because it is doing most of the work: when a
    // healthy roster faces a bare wire, every gain and every cover value is 0.00
    // and the LAST key decides the whole screen. It must not be raw points -
    // that ranks by who scores most, and the men who score most are quarterbacks,
    // of whom you start one and already hold two. So: flex-eligible before QB,
    // then MEASURED floor (his own thesis for what a bench player is for), then
    // this week's projection. Unmeasured players sort last rather than being
    // floated by a projection nothing corroborates.
    const flexFirst=p=>(['RB','WR','TE'].includes(p.pos)?0:1);
    if(FA_MODE==='ceil'){
      // Ceiling has the same trap as points: quarterbacks post the biggest
      // numbers and you start one of them. Rank the eight skill slots first,
      // then quarterbacks, rather than pretending a QB27 ceiling is available
      // to a man already holding two.
      rows.sort((a,b)=>(flexFirst(a.p)-flexFirst(b.p))
                     ||((b.beats==null?-99:b.beats)-(a.beats==null?-99:a.beats))
                     ||(b.score-a.score));
      return rows;
    }
    rows.sort((a,b)=>
        (b.score-a.score)
     || ((b.cover||0)-(a.cover||0))
     || (flexFirst(a.p)-flexFirst(b.p))
     || ((b.p.h10==null?-1:b.p.h10)-(a.p.h10==null?-1:a.p.h10))
     || ((b.wkproj||0)-(a.wkproj||0)));
  }
  return rows;
}
// One place that knows what each column means, so sorting and rendering cannot
// drift apart.
function faCell(r,key,raw){
  const p=r.p, wk=faTargetWeek();
  switch(key){
    case 'score': return raw?r.score:(r.score>0?'+':'')+r.score.toFixed(1);
    case 'cover': return raw?(r.cover==null?null:r.cover):(r.cover==null?'&mdash;':r.cover.toFixed(1));
    case 'wk':    return raw?r.wkproj:(r.wkproj===null?(onBye(p,wk)?'BYE':'&mdash;'):r.wkproj.toFixed(1));
    case 'pts':   return raw?(p.pts||null):(p.pts?p.pts.toFixed(0):'&mdash;');
    case 'h10':   return raw?(p.h10==null?null:p.h10):(p.h10==null?'&mdash;':Math.round(p.h10*100)+'%');
    case 'h15':   return raw?(p.h15==null?null:p.h15):(p.h15==null?'&mdash;':Math.round(p.h15*100)+'%');
    case 'ceil':  return raw?(p.ceil==null?null:p.ceil):(p.ceil==null?'&mdash;':p.ceil.toFixed(1));
    case 'flr':   return raw?(p.flr==null?null:p.flr):(p.flr==null?'&mdash;':p.flr.toFixed(1));
    case 'bye':   return raw?(p.bye||null):(p.bye||'—');
    default: return raw?null:'';
  }
}
const FA_COLS={
  now :[['score','GAIN'],['cover','IF OUT'],['wk','WK PROJ'],['h10','10+'],['bye','BYE']],
  next:[['score','GAIN'],['cover','IF OUT'],['wk','WK PROJ'],['h10','10+'],['bye','BYE']],
  ros :[['score','GAIN'],['cover','IF OUT'],['pts','SEASON'],['h10','10+'],['bye','BYE']],
  bye :[['score','GAIN'],['wk','WK PROJ'],['h10','10+'],['flr','FLOOR'],['bye','HIS BYE']],
  ceil:[['ceil','CEILING'],['beats','VS YOURS'],['h15','15+'],['h10','10+'],['g25','GAMES']]
};

function faHeader(){
  const wk=faTargetWeek();
  const reg=regularSeason();
  let h='<div class="card"><h2>Free agency — first come, first served</h2>';
  h+='<p style="font-size:12px;color:var(--ink-3)">Rostered players read from <b>'+FA_SOURCE+
     '</b> &middot; '+ROSTERED.size+' accounted for &middot; pool of <b>'+Object.keys(FA).length+
     '</b> projected players'+(FA_META.n_on_board?' ('+(Object.keys(FA).length-FA_META.n_on_board)+
     ' of them never on the draft board)':'')+'.</p>';
  h+='<p>No FAAB and no waiver period in this league — whoever clicks first gets him.</p>';
  if(!reg){
    h+='<div class="note"><div class="lb">Not the regular season yet</div>Sleeper reports <b>'+
       (NFLSTATE?NFLSTATE.season_type:'unknown')+'</b> season'+(NFLSTATE?', week '+NFLSTATE.week:'')+
       '. Week numbers below are ones you picked, not the live week. This screen becomes real in week 1.</div>';
  }
  h+='</div>';
  // mode selector
  h+='<div class="card"><h2>What are you trying to fix?</h2><div class="modes">';
  Object.keys(FA_MODES).forEach(k=>{
    h+='<button class="mode'+(FA_MODE===k?' on':'')+'" data-mode="'+k+'">'+FA_MODES[k].lb+'</button>';
  });
  h+='</div>';
  h+='<p style="margin-top:9px">'+FA_MODES[FA_MODE].hint.replace('%W%','<b>week '+wk+'</b>')+'</p>';
  // week + position controls
  h+='<div class="ctl"><label>Week <select id="faWk">';
  for(let w=1;w<=18;w++) h+='<option value="'+w+'"'+(w===FA_WEEK?' selected':'')+'>'+w+'</option>';
  h+='</select></label><label>Position <select id="faPos">';
  ['ALL','QB','RB','WR','TE'].forEach(p=>{ h+='<option value="'+p+'"'+(FA_POS===p?' selected':'')+'>'+p+'</option>'; });
  h+='</select></label></div></div>';
  return h;
}

function viewFA(){
  if(!ROSTERED){
    $('view').innerHTML='<div class="card"><h2>Free agency</h2><p>Loading rosters&hellip;</p></div>';
    Promise.all([loadState(),loadRosters()]).then(([s,ok])=>{ if(ok) render(); else $('view').innerHTML=
      '<div class="card warn"><h2>Free agency</h2><p>Could not read league rosters. Sleeper may not have settled them yet. Retry in a moment.</p></div>'; });
    return;
  }
  const mine=myPlayers();
  const wk=faTargetWeek();
  let h=faHeader();

  // ---- your own week, before anything is added -------------------------
  const L=weekLineup(mine,wk);
  const outThisWeek=mine.filter(p=>onBye(p,wk));
  h+='<div class="card'+(L.legal?'':' warn')+'"><h2>Your week '+wk+' as it stands</h2>'+
     '<p>Best legal lineup projects <b>'+L.total.toFixed(1)+'</b> points from '+L.filled+' of 9 slots'+
     (L.legal?'':' — <b>you cannot field a legal lineup</b>')+'.</p>';
  if(outThisWeek.length) h+='<p><b>'+outThisWeek.length+'</b> on bye: '+
     outThisWeek.map(p=>p.n).join(', ')+'</p>';
  const ros=rosLineup(mine,FA_WEEK);
  h+='<p style="font-size:12.5px;color:var(--ink-3)">The week figure above uses Sleeper&rsquo;s <b>per-week</b> '+
     'projection (what he scores <i>if he plays</i>). The rest-of-season figure below uses the <b>season</b> '+
     'projection spread over the 17 weeks he plays, because summing per-week numbers inflates anyone whose '+
     'job is uncertain &mdash; they run about 9% high in total and up to 2.4x for individual quarterbacks. '+
     'Two different questions, two different denominators, not mixed.</p>';
  h+='<p style="font-size:12.5px;color:var(--ink-3)">Rest of season from week '+FA_WEEK+
     ': <b>'+ros.total.toFixed(0)+'</b> across '+ros.weeks+' weeks'+
     (ros.shortWeeks.length?' &middot; <b style="color:var(--bad)">short in week '+ros.shortWeeks.join(', ')+'</b>':'')+'.</p></div>';

  // ---- the ranked wire --------------------------------------------------
  const rows=faRows();
  // Said before the table, not after it. A ranked list of 384 names reads as
  // "here are your options" even when the honest answer is "there are none",
  // and this tool has been wrong that way before.
  const anyGain=rows.filter(r=>r.score>0.3).length;
  const anyCover=rows.filter(r=>(r.cover||0)>0.3).length;
  if(!anyGain&&!anyCover&&FA_MODE!=='ceil'){
    h+='<div class="card warn"><h2>The wire cannot help you in week '+wk+'</h2>'+
       '<p>Of <b>'+rows.length+'</b> available players, <b>none</b> raises your week '+wk+' lineup, and '+
       '<b>none</b> is worth holding as cover &mdash; even with your best man at his position removed, '+
       'someone already on your roster is still better.</p>'+
       '<p>The list below is therefore ordered by <b>measured 2025 floor</b>, flex-eligible first, '+
       'so it answers "who would I take if I had to" &mdash; not "who should I take". '+
       'Those are different questions and this screen will not blur them.</p></div>';
  }

  const cols=FA_COLS[FA_MODE];
  const shown=rows.slice(0,40);
  if(!shown.length){
    h+='<div class="card"><h2>Nothing to show</h2><p>No free agent matches this filter. Widen the position filter, or try another mode.</p></div>';
  }else{
    h+='<div class="card"><h2>'+FA_MODES[FA_MODE].lb+' — '+rows.length+' free agents ranked</h2>'+
       '<div class="tscroll"><table><thead><tr><th>Player</th>';
    cols.forEach(c=>{ h+='<th class="sortable'+(FA_SORT===c[0]?' on':'')+'" data-sort="'+c[0]+'">'+c[1]+'</th>'; });
    h+='</tr></thead><tbody>';
    shown.forEach(r=>{
      const p=r.p;
      const role=p.inj?('<span style="color:var(--bad)">'+String(p.inj).slice(0,4).toUpperCase()+'</span>')
                      :(p.dcp&&p.dcp!==p.pos?p.dcp:(p.dco?p.pos+p.dco:''));
      h+='<tr class="row'+(p.mb!=='M'?' lot':'')+'"><td><span class="pn">'+p.n+'</span>'+
         '<span class="pm">'+p.pos+(p.tm?' &middot; '+p.tm:'')+(role?' &middot; '+role:'')+
         (r.bumped?' · over '+r.bumped:'')+'</span></td>';
      cols.forEach(c=>{
        const v=faCell(r,c[0],false);
        // >=0.05, not >0: a gain that DISPLAYS as +0.0 must not be coloured
        // as an improvement. Green on a rounded zero is a small lie.
        const good=(c[0]==='score'&&r.score>=0.05);
        h+='<td'+(good?' style="color:var(--good);font-weight:600"':'')+'>'+v+'</td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    h+='<p style="margin-top:9px;font-size:12.5px;color:var(--ink-3)">'+
       'GAIN is the change in <b>your own</b> projected starting lineup, never a rating of the player. '+
       '<b>IF OUT</b> is the same number computed with your best player at his position removed &mdash; what he is worth as cover. '+
       'A third quarterback scores near zero there however many points he projects, because you start one. '+
       'Rows dimmed have <b>no 2025 history</b> — their measured columns are blank rather than guessed. '+
       'A blank week projection means <b>not projected</b> (bye, or none issued); it is not a zero.</p>';
    h+='</div>';
  }

  const top=shown.filter(r=>r.score>0.3)[0];
  if(top){
    const p=top.p;
    h+='<div class="hero"><div class="kicker">GRAB FIRST · '+FA_MODES[FA_MODE].lb+'</div>'+
       '<div class="nm">'+p.n+'</div><div class="meta">'+p.pos+(p.tm?' &middot; '+p.tm:'')+
       (p.bye?' · bye '+p.bye:'')+(p.pts?' &middot; '+p.pts.toFixed(0)+' season proj':'')+'</div><ul class="why">'+
       ['<b>'+(top.score>0?'+':'')+top.score.toFixed(1)+'</b> to your '+
          (FA_MODE==='ros'?'rest-of-season total':'week '+wk+' lineup'),
        top.bumped?'He starts over <b>'+top.bumped+'</b>, who moves to your bench':'',
        p.h10!=null?'Cleared 10 points in <b>'+Math.round(p.h10*100)+'%</b> of his 2025 weeks ('+p.g25+' games)':
                    '<b>No 2025 history</b> — floor unmeasured, and that is a real unknown',
        p.dcp&&p.dco?'Listed <b>'+(p.dcp||p.pos)+p.dco+'</b> on the depth chart per Sleeper':'',
        p.inj?'<b style="color:var(--bad)">'+String(p.inj).toUpperCase()+'</b> per Sleeper — check before you claim':''
       ].filter(Boolean).map(x=>'<li><span>'+x+'</span></li>').join('')+'</ul></div>';
  }else if(shown.length){
    h+='<div class="card"><h2>Nobody here improves your lineup</h2><p>Every free agent projects below what you already start in week '+wk+
       '. That is a good sign, not a bug — it means your starters are the best available. Check again after injuries.</p></div>';
  }

  // ---- what adding costs you -------------------------------------------
  // The screen used to show only the upside of an add. In a full roster every
  // add is also a DROP, and the shape of what is left matters: last year's
  // twelve managers finished QB 1-2, RB 4-7, WR 5-7, TE 1-3, and going outside
  // that is the same mistake that once produced a five-tight-end mock.
  h+=faShapeCheck(mine);

  // ---- roster rail ------------------------------------------------------
  h+=faRosterPanel(mine,wk);

  // ---- standing checks --------------------------------------------------
  h+=faWasteCheck(mine,rows);
  h+='<div class="card warn"><h2>What this cannot see</h2>'+
     '<p>Rosters come from Sleeper, so a player someone claimed seconds ago may still show here until the next poll. '+
     'Weekly projections are Sleeper’s and are refreshed twice a day, not live. '+
     'There is <b>no strength-of-schedule adjustment</b> anywhere on this screen — no defensible 2026 defensive metric exists in this project, and inventing one would be worse than leaving it out.</p></div>';
  $('view').innerHTML=h;
  faBind();
}

// Observed roster shapes from last year's 12 real managers in this league.
const OBS={QB:[1,2],RB:[4,7],WR:[5,7],TE:[1,3]};
function faShapeCheck(mine){
  const c={QB:0,RB:0,WR:0,TE:0};
  mine.forEach(p=>{ if(c[p.pos]!==undefined) c[p.pos]++; });
  const over=Object.keys(OBS).filter(pos=>c[pos]>OBS[pos][1]);
  // weakest MEASURED floor among flex-eligible bench - what an add actually costs
  const flex=mine.filter(p=>['RB','WR','TE'].includes(p.pos)&&p.h10!=null);
  flex.sort((a,b)=>a.h10-b.h10);
  let h='';
  if(over.length){
    h+='<div class="card warn"><h2>Your roster is outside the shape this league drafts</h2>'+
       over.map(pos=>'<p>You hold <b>'+c[pos]+' '+pos+'s</b>. Last year all twelve managers finished with '+
         OBS[pos][0]+'&ndash;'+OBS[pos][1]+'. You start one '+pos+
         (pos==='TE'||pos==='RB'||pos==='WR'?' plus flex':'')+
         ', so the extra one is a bench spot spent where the wire is deepest.</p>').join('')+
       '<p style="font-size:12.5px">This is the standing version of the check that once produced a five-tight-end roster. '+
       'It is a flag, not a verdict &mdash; if the surplus player is genuinely better than what you would hold instead, keep him.</p></div>';
  }
  if(flex.length){
    h+='<div class="card"><h2>What an add would cost you</h2>'+
       '<p>Your weakest flex-eligible bench pieces by MEASURED 2025 ten-point rate. Adding anyone means dropping one of these:</p>'+
       flex.slice(0,3).map(p=>'<div class="alt"><span class="an">'+p.n+
         ' <span class="pm" style="display:inline">'+p.pos+(p.tm?' &middot; '+p.tm:'')+'</span></span>'+
         '<span class="ar">clears 10 in <b>'+Math.round(p.h10*100)+'%</b> of weeks &middot; bye '+(p.bye||'&mdash;')+'</span></div>').join('')+
       '<p style="margin-top:9px;font-size:12.5px;color:var(--ink-3)">A pickup whose own 10+ rate is BELOW these is a downgrade to your bench floor, '+
       'whatever his projection says &mdash; and bench floor is the thing you identified as separating teams here.</p></div>';
  }
  return h;
}
function faRosterPanel(mine,wk){
  const L=weekLineup(mine,wk);
  const starters=new Set(['QB','RB','WR','TE','FLEX'].flatMap(k=>L.line[k].map(x=>x.p.n)));
  let h='<div class="card"><h2>Your roster in week '+wk+'</h2><div class="tscroll"><table><thead><tr>'+
        '<th>Player</th><th>WK '+wk+'</th><th>10+</th><th>BYE</th></tr></thead><tbody>';
  mine.slice().sort((a,b)=>{
    const sa=starters.has(a.n)?0:1, sb=starters.has(b.n)?0:1;
    return sa-sb||((wp(b,wk)||0)-(wp(a,wk)||0));
  }).forEach(p=>{
    const v=wp(p,wk);
    const st=starters.has(p.n);
    h+='<tr'+(st?'':' class="lot"')+'><td><span class="pn">'+(st?'&#9679; ':'')+p.n+'</span>'+
       '<span class="pm">'+p.pos+(p.tm?' &middot; '+p.tm:'')+(st?' · starting':' · bench')+'</span></td>'+
       '<td>'+(v===null?(onBye(p,wk)?'<b style="color:var(--bad)">BYE</b>':'&mdash;'):v.toFixed(1))+'</td>'+
       '<td>'+(p.h10==null?'&mdash;':Math.round(p.h10*100)+'%')+'</td>'+
       '<td>'+(p.bye||'—')+'</td></tr>';
  });
  h+='</tbody></table></div><p style="font-size:12.5px;color:var(--ink-3);margin-top:8px">'+
     '&#9679; marks the nine the week-'+wk+' projection would start.</p></div>';
  return h;
}

// A bench player is only worth a roster spot if the wire cannot replace him.
// This is the standing version of the check the draft engine failed at 13.09.
function faWasteCheck(mine,rows){
  const best={};
  rows.forEach(r=>{ const p=r.p; if(p.h10==null) return;
    if(!best[p.pos]||p.h10>best[p.pos].h10) best[p.pos]=p; });
  const wk=faTargetWeek();
  const L=weekLineup(mine,wk);
  const starters=new Set(['QB','RB','WR','TE','FLEX'].flatMap(k=>L.line[k].map(x=>x.p.n)));
  const wasted=mine.filter(p=>{
    if(starters.has(p.n)) return false;
    const f=best[p.pos];
    return f&&p.h10!=null&&f.h10>=p.h10;
  });
  if(!wasted.length) return '';
  let h='<div class="card warn"><h2>Roster spots the wire can replace for free</h2>'+
    '<p>These bench players are matched or beaten by someone <b>currently unrostered</b> at the same position, '+
    'on measured 2025 ten-point rate. Holding them costs a spot you could spend where the wire is thin.</p>';
  wasted.forEach(p=>{ const f=best[p.pos];
    h+='<div class="alt"><span class="an">'+p.n+' <span class="pm" style="display:inline">'+p.pos+
       ' · clears 10 in '+Math.round(p.h10*100)+'% of weeks</span></span>'+
       '<span class="ar">free right now: <b>'+f.n+'</b> at '+Math.round(f.h10*100)+'%</span></div>';});
  h+='<p style="margin-top:9px;font-size:12.5px">Both rates are 2025 measurements. A high 2025 rate with a low '+
     '2026 projection usually means a role the player no longer has — check the depth-chart note before you drop anyone.</p></div>';
  return h;
}

function faBind(){
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
    FA_MODE=b.dataset.mode; FA_SORT=null;
    if(FA_MODE==='bye'){
      // Default the bye filler to the week that actually hurts most.
      const mine=myPlayers(); let worst=null,worstN=0;
      for(let w=1;w<=18;w++){ const n=mine.filter(p=>onBye(p,w)).length;
        if(n>worstN){worstN=n;worst=w;} }
      if(worst) FA_WEEK=worst;
    }
    render();
  });
  const wkSel=$('faWk'); if(wkSel) wkSel.onchange=()=>{ FA_WEEK=+wkSel.value; render(); };
  const posSel=$('faPos'); if(posSel) posSel.onchange=()=>{ FA_POS=posSel.value; render(); };
  document.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    if(FA_SORT===k) FA_DESC=!FA_DESC; else { FA_SORT=k; FA_DESC=true; }
    render();
  });
}

// ============================ start / sit ================================
// The gap HANDOFF listed at 5.5: there was no weekly lineup tool at all. Draft
// Sharks put floor, ceiling, projection and a win probability for BOTH teams at
// the top of their Team Dashboard, and that framing is right - the question on
// Sunday is not "who is good" but "who beats the man I would otherwise start,
// and does it change whether I win".
//
// Win probability is computed, not asserted. It uses MEASURED weekly standard
// deviations from real 2025 scores; players with no 2025 history fall back to
// the positional median sd, and the count of such players is shown, because a
// probability resting mostly on fallbacks deserves to be distrusted.
let LU_WEEK=null, MATCHUP=null, MATCHUP_WK=null;
const FALLBACK_SD={QB:7.2,RB:6.5,WR:6.3,TE:5.5};   // medians from variance.py

function luWeek(){
  if(LU_WEEK!==null) return LU_WEEK;
  LU_WEEK = regularSeason()? Math.min(18,Math.max(1,NFLSTATE.week)) : 1;
  return LU_WEEK;
}
function sdOf(p){
  if(p&&p.sd!=null) return {sd:p.sd,basis:'M'};
  return {sd:(FALLBACK_SD[p?p.pos:'WR']||6.3),basis:'F'};
}
// Normal CDF - Abramowitz & Stegun 7.1.26, plenty for a win probability.
function ncdf(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?1-p:p;
}
function lineupStats(list,wk){
  const L=weekLineup(list,wk);
  const st=['QB','RB','WR','TE','FLEX'].flatMap(k=>L.line[k]);
  let varsum=0, nFall=0;
  st.forEach(x=>{ const s=sdOf(x.p); varsum+=s.sd*s.sd; if(s.basis==='F') nFall++; });
  return {line:L.line,total:L.total,filled:L.filled,legal:L.legal,
          sd:Math.sqrt(varsum),fallbacks:nFall,starters:st};
}
async function loadMatchup(wk){
  // Sleeper only has matchups once the regular season is running. Before that
  // this returns nothing and the screen says so rather than inventing a rival.
  //
  // Returns TRUE only when it fetched something new. The caller re-renders on a
  // truthy result, and returning the cached matchup here put the page into an
  // infinite render loop the moment a matchup existed: render -> loadMatchup ->
  // cache hit -> render. It never fired before week 1, so it would have shipped
  // and hung the page on the first Sunday that mattered.
  if(MATCHUP_WK===wk) return false;
  MATCHUP=null; MATCHUP_WK=wk;
  if(!regularSeason()) return false;
  try{
    const r=await fetch('https://api.sleeper.app/v1/league/'+(LEAGUE_ID||CFG.league_id)+'/matchups/'+wk,{cache:'no-store'});
    if(!r.ok) return false;
    const rows=await r.json();
    if(!rows||!rows.length) return false;
    const myRid=CFG.roster_by_owner[CFG.me_id];
    const meRow=rows.find(x=>x.roster_id===myRid);
    if(!meRow) return false;
    const opp=rows.find(x=>x.matchup_id===meRow.matchup_id&&x.roster_id!==myRid);
    MATCHUP={me:meRow,opp:opp||null};
    return true;                     // newly fetched - one re-render, then done
  }catch(e){ MATCHUP=null; }
  return false;
}
function ridToName(rid){
  const owner=Object.keys(CFG.roster_by_owner).find(o=>CFG.roster_by_owner[o]===rid);
  return (owner&&CFG.user_names[owner])||('Roster '+rid);
}

function viewLineup(){
  if(!ROSTERED){
    $('view').innerHTML='<div class="card"><h2>Lineup</h2><p>Loading rosters&hellip;</p></div>';
    Promise.all([loadState(),loadRosters()]).then(()=>render());
    return;
  }
  const wk=luWeek();
  const mine=myPlayers();
  const S=lineupStats(mine,wk);
  let h='<div class="card"><h2>Week '+wk+' lineup</h2>';
  if(!regularSeason()){
    h+='<div class="note"><div class="lb">Not the regular season yet</div>Sleeper reports <b>'+
       (NFLSTATE?NFLSTATE.season_type:'unknown')+'</b> season. There is no live matchup to read, so the '+
       'opponent and win probability below are unavailable rather than estimated.</div>';
  }
  h+='<div class="ctl"><label>Week <select id="luWk">';
  for(let w=1;w<=18;w++) h+='<option value="'+w+'"'+(w===wk?' selected':'')+'>'+w+'</option>';
  h+='</select></label></div></div>';

  // ---- projection, floor, ceiling ---------------------------------------
  // Floor and ceiling of the LINEUP, not the sum of nine individual floors.
  // Summing each starter's 15th percentile gives the week where all nine have a
  // bad day at once - for this roster that is 57.5 against a 133.6 projection,
  // a number that reads like a floor and is nothing of the sort. The lineup
  // total is what matters, and its spread is sqrt(sum of variances), so the
  // 15th/85th percentiles sit about 1.036 sd either side of the projection.
  const Z15=1.036;
  const flr=S.total-Z15*S.sd, ceil=S.total+Z15*S.sd;
  const allBad=S.starters.reduce((a,x)=>a+(x.p.flr!=null?x.p.flr:x.v*0.6),0);
  const measured=S.starters.filter(x=>x.p.sd!=null).length;
  h+='<div class="card"><h2>What you project</h2>'+
     '<div class="split"><div class="lb">week '+wk+'</div>'+
     '<div class="srow"><span class="sn">Projection</span><span class="st2"><b>'+S.total.toFixed(1)+'</b></span></div>'+
     '<div class="srow"><span class="sn">Floor</span><span class="st2">'+flr.toFixed(1)+'</span></div>'+
     '<div class="srow"><span class="sn">Ceiling</span><span class="st2">'+ceil.toFixed(1)+'</span></div>'+
     '<div class="srow"><span class="sn">Week-to-week swing (sd)</span><span class="st2">&plusmn;'+S.sd.toFixed(1)+'</span></div>'+
     '</div>';
  h+='<p style="font-size:12.5px;color:var(--ink-3);margin-top:8px">Floor and ceiling are the 15th and 85th percentiles '+
     'of your <b>lineup total</b>, from weekly spreads MEASURED on real 2025 scores. <b>'+measured+' of '+
     S.starters.length+'</b> starter'+(measured===1?'':'s')+' ha'+(measured===1?'s':'ve')+' their own measured spread'+
     (S.fallbacks?'; the other '+S.fallbacks+' use the positional median, which is the weakest part of this number':'')+
     '. It assumes the nine scores are independent &mdash; if you ever start a quarterback and his own receiver, '+
     'the real spread is wider than this.</p>'+
     '<p style="font-size:12.5px;color:var(--ink-3)">For contrast, all nine starters hitting their individual 15th '+
     'percentile in the same week totals <b>'+allBad.toFixed(1)+'</b>. That is not your floor &mdash; it is a much rarer '+
     'event than a 15%-of-weeks outcome, and treating it as a floor is a mistake worth naming.</p></div>';

  // ---- opponent and win probability -------------------------------------
  if(regularSeason()){
    loadMatchup(wk).then(fresh=>{ if(fresh) render(); });
  }
  if(MATCHUP&&MATCHUP.opp){
    const oppPl=(MATCHUP.opp.players||[]).map(id=>FA[String(id)]).filter(Boolean);
    const O=lineupStats(oppPl,wk);
    const z=(S.total-O.total)/Math.sqrt(S.sd*S.sd+O.sd*O.sd);
    const wpct=ncdf(z);
    h+='<div class="card"><h2>Week '+wk+' matchup</h2>'+
       '<div class="split"><div class="lb">'+ridToName(MATCHUP.opp.roster_id)+'</div>'+
       '<div class="srow"><span class="sn">You</span><span class="st2"><b>'+S.total.toFixed(1)+'</b> &plusmn;'+S.sd.toFixed(1)+'</span></div>'+
       '<div class="srow"><span class="sn">Them</span><span class="st2"><b>'+O.total.toFixed(1)+'</b> &plusmn;'+O.sd.toFixed(1)+'</span></div>'+
       '<div class="srow"><span class="sn">Win probability</span><span class="st2"><b>'+Math.round(wpct*100)+'%</b></span></div>'+
       '</div><p style="font-size:12.5px;color:var(--ink-3);margin-top:8px">'+
       'Both sides are the <b>best legal lineup</b> from each roster, not what either manager has actually set &mdash; '+
       'your opponent may start someone worse. Probability assumes each lineup is normally distributed around its '+
       'projection with the measured weekly spread, and that the two are independent.</p></div>';
  }else if(regularSeason()){
    h+='<div class="card"><h2>Week '+wk+' matchup</h2><p>No matchup returned by Sleeper for this week yet.</p></div>';
  }

  // ---- the lineup, and what to change -----------------------------------
  const startIds=new Set(S.starters.map(x=>x.p.n));
  const bench=mine.filter(p=>!startIds.has(p.n));
  h+='<div class="card"><h2>Start these nine</h2><div class="slots">';
  ['QB','RB','WR','TE','FLEX'].forEach(k=>{
    S.line[k].forEach(x=>{
      h+='<div class="sl"><div class="lb"><span>'+k+'</span><span class="pkn">'+x.v.toFixed(1)+'</span></div>'+
         '<div class="vl">'+x.p.n+'</div></div>';
    });
  });
  for(let i=S.filled;i<9;i++) h+='<div class="sl empty crit"><div class="lb"><span>EMPTY</span></div><div class="vl">no eligible player</div></div>';
  h+='</div></div>';

  // benched players who out-project a starter at a slot they could fill
  const swaps=[];
  bench.forEach(b=>{
    const bv=wp(b,wk); if(bv===null) return;
    S.starters.forEach(x=>{
      if(x.v>=bv) return;
      const slotOk = (x.p.pos===b.pos) || (['RB','WR','TE'].includes(b.pos)&&['RB','WR','TE'].includes(x.p.pos));
      if(slotOk) swaps.push({inP:b,inV:bv,outP:x.p,outV:x.v,d:bv-x.v});
    });
  });
  swaps.sort((a,b)=>b.d-a.d);
  const seen=new Set(), best=[];
  swaps.forEach(s=>{ if(seen.has(s.inP.n)||seen.has(s.outP.n)) return;
                     seen.add(s.inP.n); seen.add(s.outP.n); best.push(s); });
  if(best.length){
    h+='<div class="card warn"><h2>Changes worth making</h2>';
    best.slice(0,4).forEach(s=>{
      h+='<div class="alt"><span class="an">Start '+s.inP.n+' <span class="pm" style="display:inline">'+
         s.inP.pos+' &middot; '+s.inV.toFixed(1)+'</span></span>'+
         '<span class="ar">over '+s.outP.n+' ('+s.outV.toFixed(1)+') &mdash; worth <b>+'+s.d.toFixed(1)+'</b></span></div>';
    });
