// ---- trades --------------------------------------------------------------
// One-for-one only, and scored on OUR numbers for BOTH sides. This is a
// structural screen - who has a surplus where you are thin - not a prediction
// that anyone accepts. There is no trade history in this project and inventing
// an acceptance probability would be exactly the sort of number that is not
// allowed here.
let TRADES_ON=false;
// Raised from 1200 once the metric loop got 29x faster. The cap matters more
// than its size suggests: it counts across opponents in order, so a low cap does
// not sample evenly - it drops the LAST rosters entirely and silently. At 6000
// the full 11-roster scan finishes well inside it, and if it ever does bite the
// warning says so.
const TRADE_CAP=6000;
function tradeSection(){
  if(!TRADES_ON){
    return '<div class="card"><h2>Trades</h2><p>Scans every one-for-one swap with all eleven rosters and keeps the ones '+
      'where <b>both sides gain</b> on these numbers. Slower than the rest of this screen, so it runs on request.</p>'+
      '<p><button id="tradeBtn" class="mode on" style="min-width:150px">FIND TRADES</button></p></div>';
  }
  if(!LEAGUE_ROSTERS){ loadLeagueRosters().then(()=>render());
    return '<div class="card"><h2>Trades</h2><p>Reading league rosters&hellip;</p></div>'; }
  const mine=myPlayers();
  const myBase=rosterMetrics(mine);
  const myRid=CFG.roster_by_owner[CFG.me_id];
  const found=[]; let tested=0, capped=false;
  LEAGUE_ROSTERS.forEach(r=>{
    if(r.roster_id===myRid) return;
    const theirs=(r.players||[]).map(id=>FA[String(id)]).filter(Boolean);
    if(theirs.length<9) return;
    const theirBase=rosterMetrics(theirs);
    mine.forEach(m=>{
      theirs.forEach(t=>{
        if(tested>=TRADE_CAP){ capped=true; return; }
        // plausible swaps only: wildly unequal projections are not trades
        if(Math.abs((m.pts||0)-(t.pts||0))>70) return;
        tested++;
        const mineAfter=mine.filter(p=>p!==m).concat([t]);
        const theirAfter=theirs.filter(p=>p!==t).concat([m]);
        const mm=rosterMetrics(mineAfter), tt=rosterMetrics(theirAfter);
        const myGain=mm.ros-myBase.ros, theirGain=tt.ros-theirBase.ros;
        if(myGain>0.5&&theirGain>0.5)
          found.push({give:m,get:t,who:ridToName(r.roster_id),myGain:myGain,
                      myPct:pct(mm.ros,myBase.ros),theirGain:theirGain,
                      myFloor:(mm.floor==null||myBase.floor==null)?null:mm.floor.best-myBase.floor.best});
      });
    });
  });
  found.sort((a,b)=>b.myGain-a.myGain);
  let h='<div class="card"><h2>Trades that help both sides</h2>';
  if(!found.length){
    h+='<p>Tested <b>'+tested+'</b> one-for-one swaps across eleven rosters. <b>None</b> leaves both teams better off on '+
       'rest-of-season points. That is common in a league that drafted well &mdash; it means no one is holding a surplus '+
       'you can exploit cheaply.</p>';
  }else{
    h+='<p>Tested <b>'+tested+'</b> one-for-one swaps. <b>'+found.length+'</b> leave both sides better off on our numbers.</p>'+
       '<div class="tscroll"><table><thead><tr><th>Swap</th><th>YOU</th><th>THEM</th><th>FLOOR</th></tr></thead><tbody>';
    found.slice(0,8).forEach(f=>{
      h+='<tr><td><span class="pn">&minus; '+f.give.n+'</span><span class="pn" style="color:var(--gold)">+ '+f.get.n+'</span>'+
         '<span class="pm">with '+f.who+'</span></td>'+
         '<td style="color:var(--good);font-weight:600">+'+f.myPct.toFixed(2)+'%</td>'+
         '<td>+'+f.theirGain.toFixed(0)+'</td>'+
         '<td>'+(f.myFloor==null?'&mdash;':(f.myFloor>0?'+':'')+Math.round(f.myFloor*100))+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  if(capped) h+='<p style="color:var(--warn)"><b>Stopped at '+TRADE_CAP+' swaps</b> to keep the page responsive. Not exhaustive.</p>';
  h+='<p style="margin-top:9px;font-size:12.5px;color:var(--ink-3)">"THEM" is what the deal is worth to <b>them</b> on the same '+
     'projections, so you can see whether it is worth proposing. It is <b>not</b> a prediction that they accept &mdash; there is no '+
     'trade history in this project, and a number for how likely someone is to say yes would be invented. Managers also value '+
     'their own players above the market, so expect to give up more than this says.</p></div>';
  return h;
}

// ============================ today ======================================
// Nine tabs is a menu, not a product. In season there are only two things you
// do - set a lineup and decide whether to touch the roster - and they were split
// across three screens (LINEUP, MOVES, PICKUP) that each answered part of it.
// This is one surface: what needs doing, then the lineup it applies to.
// The draft-time tabs are untouched; they only appear while a draft is running.
function viewToday(){
  if(!ROSTERED){
    $('view').innerHTML='<div class="card"><h2>Today</h2><p>Loading your roster&hellip;</p></div>';
    Promise.all([loadState(),loadRosters()]).then(()=>render());
    return;
  }
  const wk=luWeek(), mine=myPlayers();
  const S=lineupStats(mine,wk);
  const P=buildPlan();

  // ---- one line on where you actually stand ------------------------------
  let h='<div class="card"><h2>Week '+wk+'</h2>';
  if(!regularSeason()){
    h+='<div class="note"><div class="lb">Pre-season</div>Sleeper reports <b>'+
       (NFLSTATE?NFLSTATE.season_type:'unknown')+'</b> season, so there is no live matchup and no live week. '+
       'Everything below is for week '+wk+', which you chose &mdash; not the current one.</div>';
  }
  h+='<p>Your best legal lineup projects <b>'+S.total.toFixed(1)+'</b> points'+
     (S.legal?'':' &mdash; <b style="color:var(--bad)">and you cannot field nine</b>')+'.</p>'+
     '<div class="ctl"><label>Week <select id="tdWk">';
  for(let w=1;w<=18;w++) h+='<option value="'+w+'"'+(w===wk?' selected':'')+'>'+w+'</option>';
  h+='</select></label></div></div>';

  // ---- everything that needs doing, in one list --------------------------
  const acts=[];
  // 1. lineup changes
  const startIds=new Set(S.starters.map(x=>x.p.n));
  const bench=mine.filter(p=>!startIds.has(p.n));
  const swaps=[];
  bench.forEach(b=>{ const bv=wp(b,wk); if(bv===null) return;
    S.starters.forEach(x=>{ if(x.v>=bv) return;
      const ok=(x.p.pos===b.pos)||(['RB','WR','TE'].includes(b.pos)&&['RB','WR','TE'].includes(x.p.pos));
      if(ok) swaps.push({inP:b,inV:bv,outP:x.p,outV:x.v,d:bv-x.v}); }); });
  swaps.sort((a,b)=>b.d-a.d);
  const seen=new Set();
  swaps.forEach(s=>{ if(seen.has(s.inP.n)||seen.has(s.outP.n)||s.d<2) return;
    seen.add(s.inP.n); seen.add(s.outP.n);
    acts.push({kind:'START',t:'Start '+s.inP.n+' over '+s.outP.n,
      s:'+'+s.d.toFixed(1)+' points this week &middot; '+s.inV.toFixed(1)+' vs '+s.outV.toFixed(1),
      urgent:true}); });
  // 2. roster moves
  P.steps.forEach(st=>{
    acts.push({kind:'MOVE',t:'Drop '+st.drop.n+', add '+st.add.n,
      s:st.why[0].charAt(0).toUpperCase()+st.why[0].slice(1)+'.', urgent:false});
  });
  // 3. players who cannot play
  mine.forEach(p=>{ if(injSevere(p)&&startIds.has(p.n))
    acts.push({kind:'ALERT',t:p.n+' is '+String(p.inj).toUpperCase(),
      s:'He is in your projected lineup and may not take the field.',urgent:true}); });

  if(!acts.length){
    h+='<div class="card"><h2>Nothing to do</h2>'+
       '<p>Your lineup is already the best you can field this week, and no move on the wire beats what you hold '+
       'by more than the margin of error. Doing nothing is the correct play.</p></div>';
  }else{
    h+='<div class="card"><h2>What to do</h2>';
    acts.forEach((a,i)=>{
      h+='<div class="act"><span class="actk k-'+a.kind+'">'+a.kind+'</span>'+
         '<div class="actb"><div class="actt">'+a.t+'</div><div class="acts">'+a.s+'</div></div></div>';
    });
    h+='</div>';
  }

  // ---- the lineup itself --------------------------------------------------
  h+='<div class="card"><h2>Your week '+wk+' lineup</h2><div class="slots">';
  ['QB','RB','WR','TE','FLEX'].forEach(k=>S.line[k].forEach(x=>{
    h+='<div class="sl"><div class="lb"><span>'+k+'</span><span class="pkn">'+x.v.toFixed(1)+'</span></div>'+
       '<div class="vl">'+x.p.n+'</div></div>';
  }));
  for(let i=S.filled;i<9;i++) h+='<div class="sl empty crit"><div class="lb"><span>EMPTY</span></div><div class="vl">nobody eligible</div></div>';
  h+='</div>';
  const flr=S.total-1.036*S.sd, ceil=S.total+1.036*S.sd;
  h+='<p style="margin-top:10px;font-size:13px;color:var(--ink-2)">Typical range <b>'+flr.toFixed(0)+'</b> to <b>'+
     ceil.toFixed(0)+'</b> &mdash; the middle 70% of outcomes, from spreads measured on real 2025 weeks.</p>';
  h+='<p style="font-size:12.5px;color:var(--ink-3)">Full roster, floor and ceiling per player, and the matchup are on '+
     '<b>MORE &rarr; lineup detail</b>. Every move considered is on <b>MORE &rarr; all moves</b>. '+
     'The whole free-agent pool is on <b>WIRE</b>.</p></div>';
  $('view').innerHTML=h;
  const sel=$('tdWk'); if(sel) sel.onchange=()=>{ LU_WEEK=+sel.value; MATCHUP_WK=null; render(); };
}

// ============================ views ======================================
let INSPECT=null;
let TODAY_SEEN=0;
let VIEW='PICK', lastRank=null, lastTotal=null, lastMineCount=0, lastStarters=null;
const $=id=>document.getElementById(id);

function render(){
  const EFF=effectivePicks();
  const drafted=new Set(EFF.map(x=>String(x.player_id)));
  const cur=EFF.length+1, total=SHAPE.teams*SHAPE.rounds;
  const avail=P.filter(p=>!drafted.has(p.id));
  const teams=allTeams(EFF);
  readRoom(EFF);
  const me=teams.find(t=>t.slot===SHAPE.slot)||{total:0,rank:'-',line:lineupOf([]).line,players:[]};
  const st={depth:depthOf(me.players),line:me.line};
  const nextPick=MYPICKS.find(k=>k>=cur);
  const isMine=nextPick===cur;
  const onClock=cur<=total?mgrAt(cur):null;

  // status strip
  $('status').innerHTML = cur>total?'draft complete'
    : (EFF.length===0?'waiting for pick 1':(onClock?('pick '+rp(cur)+' &mdash; '+onClock):'complete'));
  $('rank').innerHTML = me.players.length
    ? '<b>'+ord(me.rank)+'</b> of '+SHAPE.teams
    : rp(cur);

  // per-pick gain
  let gain=null;
  if(me.players.length!==lastMineCount){
    if(lastTotal!=null && me.players.length>lastMineCount){
      const startersBefore=lastStarters, startersNow=startersFilled(me.line);
      gain={pts:me.total-lastTotal, from:lastRank, to:me.rank,
            filled:startersNow>startersBefore};
    }
    lastTotal=me.total; lastRank=me.rank; lastMineCount=me.players.length;
    lastStarters=startersFilled(me.line);
  }
  if(lastStarters==null) lastStarters=startersFilled(me.line);
  if(lastTotal==null){ lastTotal=me.total; lastRank=me.rank; lastMineCount=me.players.length; }

  const ctxBase={depth:st.depth,line:st.line,avail};
  const done = cur>total || (IS_TEST && LEAGUE_ID);
  // Four tabs in season, the draft tabs while a draft is running. The draft
  // tool is not degraded to make the in-season one tidy - they are different
  // jobs and only one of them is ever live.
  document.querySelector('nav button[data-v="PICK"]').textContent = done?'WIRE':'PICK';
  document.querySelectorAll('nav button[data-when]').forEach(b=>{
    const w=b.dataset.when;
    b.style.display = (w==='both'||(done? w==='season' : w==='draft')) ? '' : 'none';
  });
  if(done && (VIEW==='BOARD'||VIEW==='TEAM'||VIEW==='RIVALS'||VIEW==='LOG'||VIEW==='MANUAL'||
              VIEW==='MOVES'||VIEW==='LINEUP')){
    MORE_SUB=VIEW; VIEW='MORE';
    document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===VIEW?'true':'false'));
  }
  if(done && VIEW==='PICK' && !TODAY_SEEN){ TODAY_SEEN=1; VIEW='TODAY';
    document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===VIEW?'true':'false')); }
  if(VIEW==='PICK'){ if(done) viewFA(); else viewPick(avail,cur,total,nextPick,isMine,st,onClock,me,teams,gain,ctxBase); }
  if(VIEW==='BOARD')  viewBoard(avail,st);
  if(VIEW==='TODAY')  viewToday();
  if(VIEW==='MORE')   viewMore(me,st,teams,avail,EFF);
  if(VIEW==='MOVES')  viewMoves();
  if(VIEW==='LINEUP') viewLineup();
  if(VIEW==='TEAM')   viewTeam(me,st,teams);
  if(VIEW==='LEAGUE') viewLeague();
  if(VIEW==='RIVALS') viewRivals(teams,me);
  if(VIEW==='LOG')    viewLog(EFF);
  if(VIEW==='MANUAL') viewManual(avail,EFF);

  $('manualbar').innerHTML = manual.length
    ? '<div class="manualbar">'+manual.length+' pick'+(manual.length>1?'s':'')+' entered by hand &middot; Sleeper supplied '+picks.length+
      ' &middot; the feed takes over automatically if it returns</div>' : '';
  $('prov').innerHTML = 'Projections BLENDED: Rotowire via Sleeper (updated 2026-09-17 07:50 UTC) and ESPN, equal weight, both rescored to full PPR &middot; ADP FantasyFootballCalculator PPR 12-team, 151 drafts, 2026-09-10..2026-09-17 &middot; variance from real 2025 weekly scores &middot; built Thu 17 Sep, 15:34.<br>'+
    'Survival is Monte Carlo, '+SIMS+' sims, rank-based over the intervening picks. Calibration ECE 0.032 on last year&rsquo;s 180 picks. Nothing here forecasts results.';
}
function ord(n){return n+({1:'st',2:'nd',3:'rd'}[n%10>3||[11,12,13].includes(n%100)?0:n%10]||'th');}

function viewPick(avail,cur,total,nextPick,isMine,st,onClock,me,teams,gain,ctxBase){
  if(cur>total){ $('view').innerHTML='<div class="card"><h2>Draft complete</h2><p>You finished <b>'+
    ord(me.rank)+' of '+SHAPE.teams+'</b> on projected starters ('+me.total.toFixed(0)+' pts).</p></div>'; return; }
  const target=isMine?(MYPICKS.find(k=>k>cur)||cur+1):nextPick;
  const r=recommend(avail,cur,target,st,isMine);
  let h='';
  if(gain){
    const lead=teams[0].total-me.total;
    h+='<div class="gain'+(gain.pts<=0?' flat':'')+'">'+
      (gain.filled
        ? 'That pick <b>filled an empty slot</b>, so your lineup total jumps <b>+'+gain.pts.toFixed(1)+'</b>. '+
          'That is the slot going from nothing to something, not an upgrade over a player you had.'
        : 'That pick <b>upgraded</b> your lineup by <b>'+(gain.pts>=0?'+':'')+gain.pts.toFixed(1)+'</b> points.')+
      ' You are '+ord(me.rank)+' of '+SHAPE.teams+
      (lead>0?', '+lead.toFixed(0)+' behind the leader':', leading')+'.</div>';
    if(gain.from&&gain.to&&gain.from!==gain.to&&!gain.filled)
      h+='<div class="card"><p style="margin:0">Your rank moved '+ord(gain.from)+' &rarr; '+ord(gain.to)+
        '. Rank moves when <b>anyone</b> picks, not just you &mdash; while you waited, others filled slots too. '+
        'Watch your points and the gap to the leader; the rank number bounces early and settles as rosters fill.</p></div>';
  }
  if(!r.cands.length){ $('view').innerHTML=h+'<div class="card"><p>No candidates.</p></div>'; return; }
  const top=r.cands[0].p;
  const ctx=Object.assign({},ctxBase,{survMap:r.survMap,nextPick:isMine?target:nextPick,phase:r.phase,
    tierLeft:avail.filter(q=>q.tier===top.tier).length,
    nextTierDrop:(()=>{const nt=avail.filter(q=>q.tier===top.tier+1);return nt.length?top.vor-nt[0].vor:null;})()});
  h+='<div class="hero'+(isMine?'':' wait')+'">';
  h+='<div class="kicker">'+(isMine?'YOUR PICK '+rp(cur)+' &mdash; TAKE':'PLAN FOR '+rp(nextPick))+
     (r.phase==='BENCH'?' &middot; BENCH':'')+'</div>';
  h+='<div class="nm">'+top.n+'</div>';
  h+='<div class="meta">'+top.pos+(top.tm?' &middot; '+top.tm:'')+' &middot; tier '+top.tier+
     ' &middot; '+top.pts.toFixed(0)+' proj pts'+
     (top.espn!=null?' <span style="color:var(--ink-3)">(roto '+top.roto.toFixed(0)+' / espn '+top.espn.toFixed(0)+')</span>':
       ' <span style="color:var(--warn)">(Rotowire only)</span>')+
     (top.bye?' &middot; bye '+top.bye:'')+
     ((top.ffc&&top.sl&&Math.abs(top.sl-top.ffc)>=12)?
       ' <span style="color:var(--warn)">ADP split: FFC '+top.ffc.toFixed(0)+' / Sleeper '+top.sl.toFixed(0)+'</span>':'')+
     (top.dcp&&top.dcp!==top.pos?' &middot; '+top.dcp+(top.dco>1?String(top.dco):''):
        (top.dco>1?' &middot; '+top.pos+top.dco:''))+'</div>';
  if(top.inj) h+='<div class="err" style="margin:10px 0 0">'+(injSevere(top)?'<b>SERIOUS: </b>':'')+'Sleeper lists him <b>'+String(top.inj).toUpperCase()+
     (top.injb?' ('+top.injb+')':'')+'</b>'+(top.nu?', news '+daysAgo(top.nu):'')+
     '. That designation is not in his projection or his ADP. Check before you take him.</div>';
  h+='<ul class="why">'+reasonsFor(top,Object.assign({},ctx,{isTop:true})).map(x=>'<li><span>'+x+'</span></li>').join('')+'</ul>';
  if(isMine&&r.cands[0].med!=null){
    const spread=r.cands[0].med-r.cands[0].p10;
    h+='<p style="font-size:13px;color:var(--ink-2);margin:9px 0 0">Scored over '+SIMS+
      ' simulated continuations: median <b>'+r.cands[0].med.toFixed(0)+'</b>'+
      (spread>1.5?', worst tenth <b>'+r.cands[0].p10.toFixed(0)+'</b>'
                : ', and it barely moves across branches &mdash; your fallback here is stable')+
      '. The branches where your next target is gone are already counted.</p>';
  }
  const R=r.alt&&r.alt.vr, E=r.alt&&r.alt.ve;
  if(R&&E&&(R.id!==top.id||E.id!==top.id)){
    h+='<div class="split"><div class="lb">who each source would take</div>'+
      [['Blend',top,'this is the pick above'],
       ['Rotowire',R,R.id===top.id?'agrees':'disagrees'],
       ['ESPN',E,E.id===top.id?'agrees':'disagrees']]
      .map(([lab,p,tag])=>'<div class="srow"><span class="sl">'+lab+'</span>'+
        '<span class="sn">'+p.n+' <span class="pm" style="display:inline">'+p.pos+'</span></span>'+
        '<span class="st2">'+tag+'</span></div>').join('')+
      '<div class="snote">'+((R.id===top.id&&E.id===top.id)
        ? 'Both sources agree with the blend here.'
        : 'The sources disagree, so this pick is not clear-cut. Each column uses that source&rsquo;s own replacement levels &mdash; ESPN starts 38 RBs to Rotowire&rsquo;s 32, which is why it leans to backs.')+'</div></div>';
  }
  if(top.news){
    const cls = top.newsflag==='caution' ? 'err' : (top.newsflag==='boost' ? 'good' : 'note');
    const lead = top.newsflag==='caution' ? '<b>CHECK THIS &mdash; </b>'
               : (top.newsflag==='boost' ? '<b>NEWS IN HIS FAVOUR &mdash; </b>' : '');
    h+='<div class="'+cls+'" style="margin-top:11px">'+
       (lead||'<div class="lb">Draft Sharks news, '+(top.newsd||'')+'</div>')+
       top.news+(lead?' <i>('+(top.newsd||'')+')</i>':'')+'</div>';
  }
  if(top.note) h+='<div class="note"><div class="lb">Draft Sharks, 19 Aug &mdash; not part of the model</div>'+top.note+'</div>';
  if(r.cands.length>1){
    h+='<div class="alts"><div class="lb">instead of</div>';
    r.cands.slice(1,4).forEach(c=>{
      h+='<div class="alt"><span class="an">'+c.p.n+' <span class="pm" style="display:inline">'+c.p.pos+
         (c.p.tm?' &middot; '+c.p.tm:'')+'</span></span><span class="ar">'+
         whyNot(top,c.p,ctx,r.cands[0],c)+'</span></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  if(RUN) h+='<div class="card warn"><h2>'+RUN.pos+' run happening</h2><p><b>'+RUN.count+' of the last '+RUN.of+
    ' picks</b> were '+RUN.pos+'. <b>This is shown as fact and is NOT fed into the survival numbers</b>, because in this '+
    'league runs do not continue &mdash; tested on last year\u2019s 180 picks, after 5 of 8 at a position the next pick was '+
    'that position only 31% of the time against a 41% baseline. The pool thins and the room moves on. Chasing a run here '+
    'would be backwards; if anything the position AFTER the run is where value sits.</p></div>';
  // are the seats between you and your next pick reaching?
  if(nextPick&&nextPick>cur){
    const seats=[]; for(let k=cur;k<nextPick;k++){ const s=PICKMAP[k]; if(s&&s!==SHAPE.slot&&!seats.includes(s)) seats.push(s); }
    const sharp=seats.map(s=>({s,b:BIAS[s]})).filter(x=>x.b&&x.b.n>=2&&x.b.bias<=-5);
    if(sharp.length) h+='<div class="card warn"><h2>Sharp seats ahead of you</h2><p>'+
      sharp.map(x=>'<b>'+(SHAPE.nameBySlot[x.s]||('Team '+x.s))+'</b> is taking players <b>'+
        Math.abs(x.b.bias).toFixed(0)+' picks earlier</b> than ADP ('+x.b.n+' pick'+(x.b.n>1?'s':'')+' observed)').join('; ')+
      '. <b>Shown as fact, not fed into the model.</b> Tested on last year\u2019s 180 picks, how much a manager has reached so far predicts their next pick at r=+0.01 &mdash; so acting on it would be acting on noise. Use your own judgement about whether this one is sharp.</p></div>';
  }
  if(onClock&&!isMine) h+='<div class="card"><p>On the clock: <b>'+onClock+'</b> '+basisTag(onClock)+'</p></div>';
  const crit=Object.keys(REQ).filter(k=>st.depth[k]<REQ[k]);
  if(crit.length&&cur>SHAPE.teams*8) h+='<div class="card warn"><h2>Roster hole</h2><p>You still have no legal starter at <b>'+
    crit.join(', ')+'</b>. Flex cannot cover a dedicated slot.</p></div>';
  $('view').innerHTML=h;
}

function compareCard(p, avail, st){
  // "why not him" - the head-to-head against whatever the tool is recommending
  const cur=effectivePicks().length+1;
  const nxt=MYPICKS.find(k=>k>=cur), isMine=nxt===cur;
  const target=isMine?(MYPICKS.find(k=>k>cur)||cur+1):nxt;
  const r=recommend(avail,cur,target,st,isMine);
  const top=r.cands[0]?r.cands[0].p:null;
  if(!top) return '';
  const sv=x=>{const v=r.survMap[x.id]; return v==null?null:Math.round(v*100);}
  const gap=(top.vor+tilt(top))-(p.vor+tilt(p));
  const sp=sv(p), stp=sv(top);
  let verdict;
  if(p.id===top.id) verdict='This IS the recommendation.';
  else if(gap<=3) verdict='Effectively a coin flip &mdash; only '+gap.toFixed(0)+' points between them. Take the one you believe in.';
  else if(sp!=null&&stp!=null&&sp>=60&&stp<=25) verdict='He is '+gap.toFixed(0)+' points behind, AND '+sp+'% likely to still be here at '+rp(target)+' while the pick above is only '+stp+'%. Waiting on him is the cheaper option.';
  else if(sp!=null&&sp<=25) verdict='He is '+gap.toFixed(0)+' points behind and only '+sp+'% to last to '+rp(target)+' &mdash; so taking him means giving up the better player to secure the worse one.';
  else {
    verdict='He is '+gap.toFixed(0)+' points behind on the blend';
    if(sp!=null&&stp!=null&&(sp-stp)>=15)
      verdict+=', but <b>'+sp+'% likely to last to '+rp(target)+'</b> against '+stp+
        '% for the pick above &mdash; so you may be able to have both by taking the other one first';
    else if(sp!=null&&stp!=null&&(stp-sp)>=15)
      verdict+=', and <b>less likely to last</b> ('+sp+'% vs '+stp+'%), so taking him now costs you the better player';
    verdict+='.';
    // where the sources split, say so - the blend can hide a real disagreement
    if(p.roto!=null&&p.espn!=null&&top.roto!=null&&top.espn!=null){
      const pr=p.roto-top.roto, pe=p.espn-top.espn;
      if(pr>0&&pe<0) verdict+=' Note the sources split: <b>Rotowire prefers '+p.n+'</b> by '+pr.toFixed(0)+', ESPN prefers '+top.n+' by '+(-pe).toFixed(0)+'.';
      else if(pr<0&&pe>0) verdict+=' Note the sources split: <b>ESPN prefers '+p.n+'</b> by '+pe.toFixed(0)+', Rotowire prefers '+top.n+' by '+(-pr).toFixed(0)+'.';
    }
  }
  const line=(lab,a,b)=>'<div class="srow"><span class="sl">'+lab+'</span><span class="sn">'+a+'</span><span class="st2">'+b+'</span></div>';
  return '<div class="card" style="border-color:var(--gold)"><h2>'+p.n+' &mdash; why not him</h2>'+
    '<div class="split" style="margin-top:0">'+
    line('&nbsp;', '<b>'+p.n+'</b> ('+p.pos+')', '<b>'+top.n+'</b> ('+top.pos+')')+
    line('blend', p.pts.toFixed(0)+'  (vor '+p.vor.toFixed(0)+')', top.pts.toFixed(0)+'  (vor '+top.vor.toFixed(0)+')')+
    line('rotowire', p.roto!=null?p.roto.toFixed(0):'&mdash;', top.roto!=null?top.roto.toFixed(0):'&mdash;')+
    line('espn', p.espn!=null?p.espn.toFixed(0):'&mdash;', top.espn!=null?top.espn.toFixed(0):'&mdash;')+
    line('lasts to '+rp(target), sp!=null?sp+'%':'&mdash;', stp!=null?stp+'%':'&mdash;')+
    line('2025 weeks', p.floor!=null?(p.floor+'&ndash;'+p.ceil):'no history', top.floor!=null?(top.floor+'&ndash;'+top.ceil):'no history')+
    '<div class="snote">'+verdict+'</div></div>'+
    (p.news?'<div class="'+(p.newsflag==='caution'?'err':(p.newsflag==='boost'?'good':'note'))+'"><div class="lb">Draft Sharks news, '+(p.newsd||'')+'</div>'+p.news+'</div>':'')+
    (p.note?'<div class="note"><div class="lb">Draft Sharks, 19 Aug</div>'+p.note+'</div>':'')+
    '<button class="mbtn" id="clearinspect" style="margin-top:10px">Close</button></div>';
}

function viewBoard(avail,st){
  let h='';
  if(INSPECT){ const ip=byId[INSPECT]; if(ip) h+=compareCard(ip,avail,st); }
  h+='<div class="chips">'+['ALL','RB','WR','TE','QB','NEEDS','QUEUE'].map(x=>
    '<button class="f" data-p="'+x+'" aria-pressed="'+(filt===x)+'">'+x+'</button>').join('')+'</div>'+
    '<p style="font-size:12px;color:var(--ink-3);margin:0 0 6px">Tap any player to see why he is not the pick.</p>';
  if(filt==='QUEUE'){
    const q=avail.filter(p=>fillsStarter(p,st.depth,st.line)&&!injSevere(p)).slice(0,40);
    h+='<div class="card"><h2>Sleeper queue &mdash; set this yourself before 8:30</h2>'+
      '<p><b>I cannot set this for you.</b> Sleeper has no public write API and I will not sign into your account. '+
      'Open Sleeper, go to your draft, and enter these in this order. If your 90 seconds run out, Sleeper takes the '+
      '<b>highest-ranked player still available</b> from your list rather than its own best-available.</p>'+
      '<p><b>Why a faller cannot break it.</b> This list is ordered by VALUE, not by who you expect to reach you. '+
      'If someone takes CeeDee Lamb at 1.05 and Puka Nacua drops to you instead, Nacua is already sitting above Lamb '+
      'here &mdash; the queue picks him automatically. The only way it fails you is if EVERY name on it is gone, which '+
      'is why it runs 40 deep rather than 10.</p>'+
      '<p><b>It fades as the draft goes on.</b> These are the best players overall, so by round 6 or 7 most will be '+
      'drafted. Re-set it from this tab between picks if you get a quiet minute; otherwise treat it as a rounds 1-5 '+
      'safety net, which is when an expired clock costs the most.</p>'+
      '<p>Ordered by value over replacement, filtered to slots you still need, with PUP/IR/Out/Doubtful players removed.</p>'+
      '<table><thead><tr><th>#</th><th>Player</th><th>Pos</th><th>Proj</th><th>Bye</th></tr></thead><tbody>'+
      q.map((p,i)=>'<tr><td style="text-align:left">'+(i+1)+'</td><td style="text-align:left"><span class="pn">'+p.n+
        '</span>'+(p.inj?' <span style="color:var(--bad);font-size:11px">'+String(p.inj).slice(0,4).toUpperCase()+'</span>':'')+
        '</td><td>'+p.pos+'</td><td>'+p.pts.toFixed(0)+'</td><td>'+(p.bye||'&mdash;')+'</td></tr>').join('')+
      '</tbody></table></div>';
    $('view').innerHTML=h;
    document.querySelectorAll('.chips button.f').forEach(b=>b.addEventListener('click',()=>{filt=b.dataset.p;render();}));
    return;
  }
  let rows=avail;
  if(filt==='NEEDS') rows=avail.filter(p=>fillsStarter(p,st.depth,st.line));
  else if(filt!=='ALL') rows=avail.filter(p=>p.pos===filt);
  rows=rows.slice(0,110);
  const key=(filt==='ALL'||filt==='NEEDS')?'tier':'pt';
  let t=null;
  rows.forEach(p=>{
    if(p[key]!==t){ if(t!==null)h+='</tbody></table>'; t=p[key];
      h+='<div class="th"><span class="tn">Tier '+t+'</span><span class="tc">'+rows.filter(x=>x[key]===t).length+' left</span></div>'+
        '<table><thead><tr><th>Player</th><th>Proj</th><th>ADP</th><th>Bye</th><th>Role</th><th>Floor&ndash;Ceil</th><th>Start%</th></tr></thead><tbody>'; }
    h+='<tr data-pid="'+p.id+'" class="row '+(p.zone==='lottery'?'lot':'')+'"><td><span class="pn">'+p.n+(p.newsflag==='caution'?' <span style="color:var(--bad)" title="news caution">&#9888;</span>':(p.newsflag==='boost'?' <span style="color:var(--good)" title="news in his favour">&#9650;</span>':''))+(p.news?' <span style="color:var(--gold)" title="news / analyst note">&#9679;</span>':(p.note?' <span style="color:var(--gold)" title="analyst note">&#9679;</span>':''))+'</span><span class="pm">'+p.pos+(p.tm?' &middot; '+p.tm:'')+'</span></td>'+
       '<td>'+p.pts.toFixed(0)+'</td><td>'+(p.adp?p.adp.toFixed(0):'&mdash;')+'</td><td>'+(p.bye||'&mdash;')+'</td>'+
       '<td>'+(p.inj?'<span style="color:var(--bad)">'+String(p.inj).slice(0,4).toUpperCase()+'</span>'
        :((p.dcp&&p.dcp!==p.pos)?p.dcp:(p.dco?p.pos+p.dco:'&mdash;')))+'</td>'+
       '<td>'+(p.floor!=null?p.floor+'&ndash;'+p.ceil:'<span style="color:var(--ink-3)">no 2025</span>')+'</td>'+
       '<td>'+(p.sr!=null?Math.round(p.sr*100)+'%':'&mdash;')+'</td></tr>';
  });
  h+='</tbody></table>';
  $('view').innerHTML=h;
  document.querySelectorAll('.chips button.f').forEach(b=>b.addEventListener('click',()=>{filt=b.dataset.p;render();}));
  document.querySelectorAll('#view tr.row').forEach(tr=>tr.addEventListener('click',()=>{
    INSPECT=(INSPECT===tr.dataset.pid)?null:tr.dataset.pid; render(); window.scrollTo(0,0); }));
  const ci=$('clearinspect'); if(ci) ci.onclick=()=>{ INSPECT=null; render(); };
}

function viewTeam(me,st,teams){
  let h='<div class="card"><h2>'+ord(me.rank)+' of '+SHAPE.teams+' &middot; '+me.total.toFixed(0)+' projected starter points</h2>';
  h+='<div class="slots">';
  [['QB',1],['RB',2],['WR',2],['TE',1],['FLEX',3]].forEach(([k,n])=>{
    for(let i=0;i<n;i++){ const p=me.line[k][i];
      const crit=!p&&REQ[k]&&st.depth[k]<REQ[k];
      h+='<div class="sl'+(p?'':' empty')+(crit?' crit':'')+'"><div class="lb"><span>'+k+'</span>'+
         (p&&p._pick?'<span class="pkn">'+rp(p._pick)+'</span>':'')+'</div><div class="vl">'+
         (p?p.n:'&mdash;')+'</div></div>'; }
  });
  me.line.BN.forEach(p=>{h+='<div class="sl"><div class="lb"><span>BN</span><span class="pkn">'+rp(p._pick)+'</span></div><div class="vl">'+p.n+'</div></div>';});
  h+='</div>';
  h+='<p style="margin-top:11px">Depth: '+Object.keys(REQ).map(k=>{
      const sp=st.depth[k]-REQ[k];
      const col=sp<0?'var(--bad)':(sp===0?'var(--warn)':'var(--ink-2)');
      return '<span style="color:'+col+'">'+k+' '+st.depth[k]+(sp<=0?' (no spare)':'')+'</span>';
    }).join(' &middot; ')+'</p>';
  const byeCount={}; ['QB','RB','WR','TE','FLEX'].forEach(k=>me.line[k].forEach(p=>{if(p&&p.bye)byeCount[p.bye]=(byeCount[p.bye]||0)+1;}));
  const clash=Object.entries(byeCount).filter(([w,n])=>n>=3);
  if(clash.length) h+='<p style="color:var(--warn)"><b>Bye clash:</b> '+clash.map(([w,n])=>n+' starters out in week '+w).join('; ')+'</p>';
  h+='</div>';
  h+='<div class="card"><h2>Polling</h2><p>Checking Sleeper every <b>'+(saver?'6s':'2.5s')+
     '</b>'+(saver?'':' (1.5s when your pick is close)')+'. Fast costs roughly 150&ndash;200MB over a full draft, '+
     'which is nothing on wifi and real money on cell. '+
     '<button class="mbtn" id="saverbtn" style="margin-top:7px">'+(saver?'Switch to fast':'Switch to data saver')+
     '</button></p></div>';
  h+='<div class="card"><h2>Weeks 15&ndash;17 &mdash; your playoffs</h2><p>Opponents as fact. <b>No difficulty rating</b> &mdash; there is no defensible 2026 defensive-strength number in this project, and inventing one would be worse than leaving it out.</p>';
  h+='<div style="font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;color:var(--ink-2);line-height:1.8">'+
     (me.players.length?me.players.map(p=>p.n+' &mdash; '+(p.po||'n/a')).join('<br>'):'no players yet')+'</div></div>';
  $('view').innerHTML=h;
  const sb=$('saverbtn');
  if(sb) sb.onclick=()=>{ saver=!saver; try{localStorage.setItem('ld_saver',saver?'1':'0');}catch(e){}
    schedule(saver?6000:2500); render(); };
}

function viewRivals(teams,me){
  let h='<div class="card"><h2>Same rosters, four valuations</h2>'+
    '<p>The tool optimises the blend, so ranking by the blend is <b>partly circular</b> &mdash; it grades itself on the number it was told to maximise. '+
    'These are the same rosters scored by each source alone, and by the market. A first place that exists in only one column is an artifact of that source, not a good draft.</p>'+
    '<table class="rank"><thead><tr><th style="text-align:left">Team</th><th>Blend</th><th>Roto</th><th>ESPN</th><th>Mkt</th></tr></thead><tbody>'+
    teams.map(t=>'<tr class="'+(t.slot===me.slot?'me':'')+'">'+
      '<td style="text-align:left">'+t.name+'</td>'+
      '<td>'+ord(t.rank_blend)+'</td><td>'+ord(t.rank_roto)+'</td><td>'+ord(t.rank_espn)+'</td><td>'+ord(t.rank_market)+'</td></tr>').join('')+
    '</tbody></table></div>';
  h+='<div class="card"><h2>Every team, live</h2><p>Ranked by best legal starting lineup on the blend.</p><table class="rank"><tbody>';
  const top=teams[0].total||1;
  teams.forEach(t=>{
    const d=depthOf(t.players);
    h+='<tr class="'+(t.slot===me.slot?'me':'')+'"><td style="width:34px">'+ord(t.rank)+'</td>'+
       '<td>'+t.name+'<span class="pm">QB'+d.QB+' RB'+d.RB+' WR'+d.WR+' TE'+d.TE+
         (BIAS[t.slot]&&BIAS[t.slot].n>=2?' &middot; '+(BIAS[t.slot].raw<0?'reaches ':'waits ')+
           Math.abs(BIAS[t.slot].raw).toFixed(0):'')+'</span></td>'+
       '<td style="width:33%"><span class="bar2"><i style="width:'+Math.max(4,Math.round(t.total/top*100))+'%"></i></span></td>'+
       '<td style="width:52px">'+t.total.toFixed(0)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="card"><h2>Who is reaching</h2><p>Average picks earlier (or later) than ADP each seat is taking players, measured live. <b>Information only &mdash; it does not move the survival numbers.</b> On last year\u2019s 180 picks a manager\u2019s reach so far predicted their next pick at r=+0.01, and reaching correlated with drafting a <b>worse</b> team (r=+0.69 between waiting and points actually drafted).</p>'+
    (Object.keys(BIAS).filter(s=>BIAS[s].n>=2).length?
      Object.keys(BIAS).filter(s=>BIAS[s].n>=2).sort((a,b)=>BIAS[a].raw-BIAS[b].raw).map(s=>
      '<div class="alt"><span class="an">'+(SHAPE.nameBySlot[s]||('Team '+s))+'</span><span class="ar">'+
      (BIAS[s].raw<0?'takes them '+Math.abs(BIAS[s].raw).toFixed(1)+' picks EARLY':'waits '+BIAS[s].raw.toFixed(1)+' picks')+
      ' over '+BIAS[s].n+' picks &middot; applied as '+BIAS[s].bias.toFixed(1)+'</span></div>').join('')
      : '<p style="color:var(--ink-3)">Nothing yet &mdash; needs at least two picks from a seat.</p>')+'</div>';
  h+='<div class="card warn"><h2>What this does not do</h2><p>These counts are what your rivals have <b>already taken</b>. The survival model does <b>not</b> assume a team with four running backs will avoid a fifth: tested on last year&rsquo;s 180 picks, that effect was not measurable in this league (direction flipped by position, RB &minus;1.8 picks vs WR +3.6). Shown so you can read the room yourself, not modelled as if it were proven.</p></div>';
  $('view').innerHTML=h;
}

function viewLog(EFF){
  const f=EFF.slice().reverse().map(x=>{
    const p=byId[String(x.player_id)], m=SHAPE.nameBySlot[PICKMAP[x.pick_no]]||'?';
    const md=x.metadata||{};
    return '<div class="'+(isMinePick(x)?'mine':'')+'">'+rp(x.pick_no)+'  '+m+' &mdash; '+
      (p?p.n+' ('+p.pos+')':((md.first_name||'')+' '+(md.last_name||'')).trim()||'?')+(x._manual?'  [hand]':'')+'</div>';
  }).join('');
  $('view').innerHTML='<div class="card"><h2>'+EFF.length+' picks</h2><div class="feed">'+(f||'none yet')+'</div></div>';
}

function viewManual(avail,EFF){
  const q=(window._mq||'').toLowerCase();
  const list=avail.filter(p=>!q||p.n.toLowerCase().includes(q)).slice(0,60);
  const nxt=EFF.length+1;
  $('view').innerHTML='<div class="card"><h2>Manual entry</h2>'+
    '<p>If Sleeper stops feeding picks, tap whoever just went and the tool carries on. It works out who picked from the slot order, so your own picks land on your roster automatically. Saved on this phone.</p>'+
    '<div class="mrow"><input id="msearch" type="search" placeholder="type a name, then tap him" autocomplete="off" autocapitalize="off" spellcheck="false">'+
    '<button class="mbtn" id="mundo">Undo</button>'+(manual.length?'<button class="mbtn danger" id="mclear">Clear</button>':'')+'</div>'+
    '<p style="margin-top:9px"><b>'+manual.length+'</b> hand-entered &middot; next is <b>'+rp(nxt)+'</b> ('+(SHAPE.nameBySlot[PICKMAP[nxt]]||'?')+')</p>'+
    '<div class="mlist" id="mlist">'+list.map(p=>'<button class="mpick" data-id="'+p.id+'"><span>'+p.n+
      '</span><span class="pm" style="display:inline">'+p.pos+(p.tm?' &middot; '+p.tm:'')+'</span></button>').join('')+'</div></div>';
  const si=$('msearch');
  if(si){ si.value=window._mq||'';
    si.addEventListener('input',e=>{ window._mq=e.target.value; repaintManualList(avail); });
  }
  bindManual();
}
function repaintManualList(avail){
  const q=(window._mq||'').toLowerCase();
  const list=avail.filter(p=>!q||p.n.toLowerCase().includes(q)).slice(0,60);
  const el=$('mlist'); if(!el) return;
  el.innerHTML=list.map(p=>'<button class="mpick" data-id="'+p.id+'"><span>'+p.n+
    '</span><span class="pm" style="display:inline">'+p.pos+(p.tm?' &middot; '+p.tm:'')+'</span></button>').join('');
  bindManual();
}
function bindManual(){
  document.querySelectorAll('.mpick').forEach(b=>b.onclick=()=>addManual(b.dataset.id));
  const u=$('mundo'); if(u) u.onclick=undoManual;
  const c=$('mclear'); if(c) c.onclick=clearManual;
}

// ============================ polling ====================================
// No conditional request: If-None-Match is not in Sleeper's CORS allow-list, so
// sending it forces a preflight that fails and kills the feed after one poll.
let pollMs=2500, timer=null;
let saver=false; try{ saver=localStorage.getItem('ld_saver')==='1'; }catch(e){}
function schedule(ms){ if(timer)clearTimeout(timer); pollMs=ms; timer=setTimeout(poll,ms); }
async function poll(){
  let data=null;
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    data=await r.json(); netOk();
  }catch(e){
    failCount++;
    if(failCount>=2) showErr('Cannot reach Sleeper ('+failCount+' tries). The board is baked into this page and stays valid. <a href="#" id="gomanual">Switch to manual entry</a> and keep drafting.');
    schedule(Math.min(12000,2500*failCount)); return;
  }
  try{ if(Array.isArray(data)&&data.length!==picks.length){ picks=data; render(); } }
  catch(e){ showErr('Display error after loading picks: '+e.message+'. The data arrived fine; this is a bug in the page, not the network.'); }
  const cur=effectivePicks().length+1, nxt=MYPICKS.find(k=>k>=cur), away=nxt?nxt-cur:99;
  if(cur>SHAPE.teams*SHAPE.rounds && VIEW==='PICK'){ await loadRosters(); render(); }
  schedule(saver?6000:(away<=3?1500:2500));
}
function showErr(m){ $('err').innerHTML='<div class="err">'+m+'</div>'; $('dot').className='dot';
  const g=$('gomanual'); if(g) g.onclick=e=>{e.preventDefault(); setView('MANUAL');}; }
function netOk(){ failCount=0; lastOk=Date.now(); $('err').innerHTML=''; $('dot').className='dot on'; }

function setView(v){
  VIEW=v;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===v?'true':'false'));
  window.scrollTo(0,0); render();
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));

(async()=>{ const r=await loadDraftShape(); banner();
  if(IS_TEST && r.ok && !r.mySlotFound){ const b=$('testbar');
    if(b) b.innerHTML+='<div style="margin-top:5px">Your account is not in this draft&rsquo;s order, so slot '+SHAPE.slot+' is an assumption. Append <b>&amp;slot=N</b> to set it.</div>'; }
  render(); poll(); })();

</script>
